name: BC test (from source) [reusable]

# Reusable workflow that compiles AL source from the calling repo, publishes
# it to a Business Central NST running on Linux, and executes the AL tests.
#
# Consumer usage (paste into .github/workflows/bc-test.yml in your repo):
#
#   name: BC Tests
#   on: [push, pull_request, workflow_dispatch]
#   jobs:
#     test:
#       uses: StefanMaron/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@master
#       with:
#         bc_version:     "27.5"
#         app_dirs:       "app"
#         test_app_dirs:  "test"
#         codeunit_range: "50000..99999"
#
# Inputs are documented under workflow_call below. For pre-built .app files
# (no compile step), use bc-test-prebuilt.yml instead.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          Runner label(s) for the test job. Defaults to ubuntu-latest.

          Point this at a self-hosted runner to get the warm-filesystem paths:
          the artifact cache, the patched service-tier volume, and — where the
          machine has been set up for it — snapshot mode, which restores a
          checkpointed BC in ~16-30s instead of booting one in ~70-140s. None
          of those need any other input; they are properties of the machine,
          not of the pipeline (docs/SNAPSHOT.md).

          GitHub has no built-in "prefer self-hosted, fall back to hosted": a
          label naming an OFFLINE runner queues rather than falling back, so a
          machine that is down stalls the pipeline instead of degrading it. If
          you need fallback, compute this value in a prior job in the calling
          workflow (query /actions/runners for the label, emit an output) and
          pass the result here.

          Accepts a plain label ("self-hosted") or a JSON array
          ('["self-hosted","linux","bc"]') for multi-label matching.
        required: false
        type: string
        default: "ubuntu-latest"
      instance_slot:
        description: >
          Which BC stack on the machine this job should use. Leave at 0 unless
          you want two jobs running BC on ONE self-hosted machine at the same
          time.

          Background: Compose names its project after the working directory's
          basename — `bc-linux` for every job — and docker-compose.yml binds
          fixed host ports. So every job on a given docker host addresses the
          same containers and the same ports, and a second job's
          `docker compose down` deletes the first job's BC mid-test (issue
          #24). This workflow therefore takes a machine-wide lease around the
          container lifecycle: jobs sharing a machine queue rather than
          destroying each other.

          Raising the slot is how you buy real parallelism instead of queueing.
          Slot N gets its own compose project (`bc-linux-N`) and its own ports,
          offset by N*100 — slot 1 puts the dev endpoint on 7149, OData on
          7148, SQL on 11533, and so on. Two jobs on different slots run
          concurrently; two on the same slot still queue.

          Budget roughly a full BC service tier plus a SQL Server per slot in
          RAM before raising it. It has no effect on a GitHub-hosted runner —
          every job there already has a machine to itself.
        required: false
        type: number
        default: 0
      bc_version:
        description: "BC platform version (e.g. 27.5)"
        required: false
        type: string
        default: "27.5"
      artifact_cache_dir:
        description: >
          Directory to hold the extracted BC artifacts. Defaults to
          <workspace>/artifact-cache, which is correct for a GitHub-hosted
          runner (fresh VM every job, so the dir is always empty and the
          download happens exactly as before).

          On a SELF-HOSTED runner the download is skipped entirely whenever the
          dir already holds the same resolved build — point this at a path
          OUTSIDE the workspace (e.g. /var/cache/bc-artifacts) to share one
          cache across every job and runner on the host. Concurrent jobs are
          safe: download-artifacts.sh locks the directory, so the second job
          waits and then hits the cache the first one wrote. Budget ~3.1 GB
          per BC version kept.
        required: false
        type: string
        default: ""
      bc_country:
        description: "BC country code (e.g. w1, de, us)"
        required: false
        type: string
        default: "w1"
      bc_type:
        description: "BC artifact type (sandbox or onprem)"
        required: false
        type: string
        default: "sandbox"
      bc_artifact_url:
        description: >-
          Full BC artifact URL to download instead of resolving
          bc_type/bc_version/bc_country against Microsoft's PUBLIC index —
          e.g. an insider build:
          "https://bcinsider-fvh2ekdjecfjd6gk.b02.azurefd.net/sandbox/29.0.53450.0/w1".
          The matching /platform URL is derived by download-artifacts.sh.
          Blank (default) keeps the normal public-index path, so existing
          consumers are unaffected. When set, still pass bc_version (the
          full version is fine) — it's what the AL tool / runtime lookups
          and the JUnit artifact name key off.
        required: false
        type: string
        default: ""
      continue_on_error:
        description: >-
          Mark the test job continue-on-error so a failure does NOT fail the
          caller's workflow run. Default false — a failing test job fails the
          run, which is what every normal consumer wants. bc-linux's own
          version matrix sets this true for the insider/preview legs, where a
          not-yet-supported BC build failing is expected news, not a
          regression. GitHub does not allow continue-on-error on a job that
          `uses:` a reusable workflow, so it has to live here, on the job
          this workflow actually runs.
        required: false
        type: boolean
        default: false
      app_dirs:
        description: "Newline-separated dirs containing app.json for production apps (compile order). Newline, not space, because a dir name can itself contain a space."
        required: false
        type: string
        default: ""
      test_app_dirs:
        description: "Newline-separated dirs containing app.json for test apps. Newline, not space, because a dir name can itself contain a space."
        required: true
        type: string
      extra_symbols_artifact_name:
        description: >-
          Opt-in. Name of a workflow-run artifact (uploaded by an earlier job
          in the same run) containing pre-fetched third-party dependency .app
          files - i.e. symbols this workflow can't resolve itself, since
          "Stage symbols from BC artifacts" only indexes the Microsoft BC
          platform artifact tree. Blank (default): skipped entirely, no
          behavior change for existing consumers. When set, the artifact is
          downloaded and its .app files (optionally scoped by
          extra_symbols_artifact_subdir) are merged into the same symbols/
          directory the BC-artifact stage populates, before compile.
        required: false
        type: string
        default: ""
      extra_symbols_artifact_subdir:
        description: >-
          Subfolder inside extra_symbols_artifact_name to pull .app files
          from (e.g. when the artifact bundles dependencies for several
          projects/callers under per-project subfolders). Blank = use the
          artifact root. Ignored when extra_symbols_artifact_name is blank.
        required: false
        type: string
        default: ""
      codeunit_range:
        description: |
          Test codeunit IDs to execute. This is the range of your TEST codeunits —
          production app codeunits aren't run, only published. Accepted formats:
            "50000..99999"                       single AL range
            "50000..50100|130450..130459"        multiple ranges (pipe-separated)
            "50000,50001,50002"                  explicit ids (comma-separated)
            "50000..50100,130450,200000..210000" mixed
        required: true
        type: string
      preprocessor_symbols:
        description: >-
          Comma-separated preprocessor symbols passed to /define
          (e.g. "BC27PLUS,BC28PLUS"). Empty = no flag passed to the compiler.
        required: false
        type: string
        default: ""
      runtime_version:
        description: >-
          Opt-in rewrite of app.json "runtime" before compile. Blank
          (default): app.json is left untouched and the project's declared
          runtime is respected. "auto": derive from bc_version (BC 27 →
          "16.0", BC 28 → "17.0") and patch every app — used by bc-linux's
          own version matrix, whose smoke-test fixture ships a placeholder
          runtime. An explicit value (e.g. "17.0") patches to exactly that.
        required: false
        type: string
        default: ""
      app_version_major_minor:
        description: >-
          Opt-in rewrite of app.json "version"'s major.minor segments before
          compile. Blank (default): every app keeps its own committed
          major.minor untouched. Matches the shape of AL-Go's own
          Update-AppJsonProperties helper (Actions/.Modules/CompileFromWorkspace.psm1),
          so a caller can pass its already-computed MajorMinorVersion through
          unchanged. Has no effect unless app_version_build or
          app_version_revision is also set — a version patch with both build
          and revision left at 0 would be a no-op anyway, so the step doesn't
          bother writing app.json for nothing.
        required: false
        type: string
        default: ""
      app_version_build:
        description: >-
          Opt-in rewrite of app.json "version"'s build (3rd) segment before
          compile. Blank/0 (default): the committed build segment is left
          untouched. Set this (together with app_version_revision as needed)
          on every CI run so each compiled app's version keeps climbing —
          otherwise BC's Deploy step sees a same-or-lower version than what's
          already installed and skips the app. See issue #38.
        required: false
        type: number
        default: 0
      app_version_revision:
        description: >-
          Opt-in rewrite of app.json "version"'s revision (4th) segment
          before compile. Blank/0 (default): the committed revision segment
          is left untouched.
        required: false
        type: number
        default: 0
      al_tool_version:
        description: >-
          Which Linux AL compiler to use
          (Microsoft.Dynamics.BusinessCentral.Development.Tools.Linux on
          nuget.org). Accepts a policy keyword or an exact version.
          "matching" (default, same as blank): newest stable of the AL major
          that matches bc_version (AL major = BC major - 11), falling back to
          that major's newest prerelease when no stable exists — required for
          a BC version still in preview, since BC 29 needs AL 18.x and there
          is no stable 18.x.
          "latest": newest stable across all majors, regardless of bc_version.
          Use this when an app declares a runtime its own major's compiler
          rejects — runtime 16.1 is refused by AL 16.2.28.57946 (which accepts
          16.0 only) but accepted by AL 17.0.34.45391. Newer compilers accept
          older runtimes, so this is safe and is what some AL-Go setups do.
          "prerelease": newest across all majors including prereleases.
          Anything else is treated as an exact version to pin.
        required: false
        type: string
        default: ""
      test_company:
        description: >-
          Company to run the tests in. Blank (default) auto-detects: the
          runner reads the OData Company page — already warm because the
          container healthcheck polls it — and picks the evaluation
          (demo) company, which is correct on every localization without
          knowing its name in advance. Set this when your database has
          more than one evaluation company, when tests must run in a
          non-demo company, or to skip the lookup entirely. Must be the
          company NAME as BC reports it (e.g. "CRONUS International
          Ltd.", "CRONUS Deutschland GmbH") — there is no id-based form,
          both the AL tool and the TestRunnerHub take a name.
        required: false
        type: string
        default: ""
      test_runner:
        description: >-
          Test execution engine. "auto" (default) = probe the live server
          after BC is healthy; when the dev endpoint advertises Dev API 7.0
          (BC 28.0+), runs each test codeunit through
          scripts/run-tests-hybrid.py, which statically scans the test
          app's AL source (only [HandlerFunctions] usage right now — see
          scripts/classify-handler-codeunits.py) and routes each codeunit
          to the fast altool/TestRunnerHub path or the classic websocket
          path per-codeunit, never both — see issue #27 for why some
          codeunits aren't safe on the hub. Falls back to the websocket
          runner outright on BC < 28. "websocket" = force the OData suite +
          WebSocket client-session flow (scripts/run-tests.sh) for
          everything, which works on every supported BC version. "altool"
          = force the AL dotnet tool's native `al runtests` command driving
          the NST's built-in /dev/TestRunnerHub SignalR hub
          (scripts/run-tests-altool.py) for EVERY codeunit, no split; fails
          hard when the server doesn't support it — useful to catch "hub
          stopped working" regressions that auto's split would silently
          paper over. Note: the altool path runs tests WITHOUT an AL test
          runner codeunit — AI tests are unsupported and isolation comes
          from the RequiredTestIsolation property (default Codeunit).
        required: false
        type: string
        default: "auto"
      altool_version:
        description: >-
          Version of the Microsoft.Dynamics.BusinessCentral.Development.Tools
          dotnet tool used when test_runner=altool. Must be a version that
          ships the `runtests` command — as of 2026-06 that's only the 18.x
          prereleases (stable 17.x has publishapp but no runtests).
        required: false
        type: string
        default: "18.0.37.11445-beta"
      runner_image:
        description: "Override the bc-runner image (defaults to the public ghcr.io tag)"
        required: false
        type: string
        default: "ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest"
      sql_image:
        description: >-
          Override the SQL Server image. Blank (default) uses bc-linux's
          GHCR mirror of mcr.microsoft.com/mssql/server:2022-latest with
          zstd-compressed layers, which isn't subject to mcr's
          intermittent WAF blocks. Set this to
          "mcr.microsoft.com/mssql/server:2022-latest" to go straight to
          Microsoft, ".../mssql:2022" for the byte-identical gzip copy, or
          to any image in your own registry. Use ".../mssql:2022-fts" if
          your apps declare OptimizeForTextSearch — no official SQL Server
          Linux image ships Full-Text Search, so those apps fail to install
          on every other variant (see KNOWN-LIMITATIONS.md).
        required: false
        type: string
        default: ""
      bc_linux_ref:
        description: "Git ref of StefanMaron/MsDyn365Bc.On.Linux to check out for scripts (master, a tag, or a commit SHA)"
        required: false
        type: string
        default: "master"
      timeout_minutes:
        description: "Job timeout"
        required: false
        type: number
        default: 45
      health_timeout_minutes:
        description: >-
          How long to wait for the BC container to report healthy. Default 30.
          BC normally reaches healthy in 1-2 minutes in CI, so the default is
          mostly headroom for a slow artifact restore. Lower it for a leg that
          is expected to fail — a preview BC version that cannot boot otherwise
          burns the full 30 minutes doing nothing, on every run.
        required: false
        type: number
        default: 30

      # ─── Analyzer / ruleset configuration ──────────────────────────────
      # All optional. Default behavior is "no analyzers, no ruleset" — same
      # as before these inputs existed, so existing consumers see no change.
      # When ANY of these are set, the compile step calls
      # scripts/resolve-analyzers.py to turn them into AL compile flags
      # (/analyzer:, /ruleset:, /enableexternalrulesets). See
      # ANALYZER-SUPPORT-PLAN.md for the full design + gotchas.
      enable_code_cop:
        description: "Enable Microsoft CodeCop"
        required: false
        type: boolean
        default: false
      enable_ui_cop:
        description: "Enable Microsoft UICop"
        required: false
        type: boolean
        default: false
      enable_app_source_cop:
        description: "Enable Microsoft AppSourceCop"
        required: false
        type: boolean
        default: false
      enable_per_tenant_extension_cop:
        description: "Enable Microsoft PerTenantExtensionCop"
        required: false
        type: boolean
        default: false
      custom_code_cops:
        description: >-
          Comma- or newline-separated list of additional cop DLLs.
          Each entry is either a local path (relative to your repo) or an
          https:// URL. URLs are downloaded fresh per run; .nupkg URLs are
          unzipped and every DLL under lib/net8.0/ is added (so pointing
          at the ALCops.Analyzers nupkg release just works — all 7 cop
          DLLs + ALCops.Common.dll come along automatically).
        required: false
        type: string
        default: ""
      ruleset_file:
        description: >-
          Local path or https:// URL to a JSON ruleset file. Passed as
          /ruleset:. Note: AL compiler accepts JSON only, not Visual
          Studio's classic XML .ruleset format.
        required: false
        type: string
        default: ""
      enable_external_rulesets:
        description: >-
          When true, pass /enableexternalrulesets so the ruleset file can
          include remote rulesets via includedRuleSets[].path entries
          pointing at https:// URLs (e.g. shared org-wide rulesets in a
          public repo).
        required: false
        type: boolean
        default: false
      enable_code_analyzers_on_test_apps:
        description: >-
          When false (default — matches AL-Go's default), test app
          compiles skip the analyzer/ruleset flags entirely. Production
          apps still get them.
        required: false
        type: boolean
        default: false

      artifact_name_suffix:
        description: >-
          Opt-in. When set, uploads the compiled production and test .app
          files as a workflow-run artifact named
          "bc-linux-build-<artifact_name_suffix>", staged under Apps/ and
          TestApps/ subfolders (mirrors AL-Go's own .buildartifacts/<Kind>/
          layout, so a downstream job can re-upload each subfolder directly
          under its own naming convention with no reshuffling). Blank
          (default): the upload step is skipped entirely — zero behavior
          change for existing consumers.

          actions/upload-artifact@v4 requires unique names within a
          workflow run, so if you call this workflow more than once in the
          same run (e.g. a matrix over projects or build modes), pass a
          value that is unique per call. bc-linux does not invent one for
          you — it uses whatever string you pass verbatim, so make sure
          it's artifact-name-safe.
        required: false
        type: string
        default: ""

      verify_authentication:
        description: >-
          Opt-in. When true, runs scripts/test-authentication.sh against
          the running BC container right after it becomes healthy — a
          positive/negative NavUserPassword auth check pair that catches
          a client-services wire-format regression before the
          publish/smoke steps below run (those would otherwise pass even
          with a broken or bypassed password check). False (default):
          the step is skipped — not every consumer of this workflow
          needs to test authentication on every run, so it doesn't run
          unless asked for.
        required: false
        type: boolean
        default: false

    secrets:
      bc_license:
        description: >-
          Optional ISV/developer BC license, base64-encoded.
          When provided, the workflow decodes it to a tempfile in the runner
          workspace, mounts it into the bc-runner + sql containers, and the
          entrypoint imports it BEFORE NST starts — eliminating the legacy
          boot/import/restart cycle that ISVs would otherwise need.
          See README.md "Custom license" section in the bc-linux repo for
          how to prepare the secret and pass it from the caller workflow.
        required: false

jobs:
  test:
    # A JSON array selects multiple labels; anything else is used verbatim.
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Default false — identical to the pre-input behavior. Only bc-linux's
    # preview matrix legs set this. See the input's description for why it
    # can't live on the calling job.
    continue-on-error: ${{ inputs.continue_on_error }}
    env:
      BC_RUNNER_IMAGE: ${{ inputs.runner_image }}
      # Blank passes through to docker-compose's `${BC_SQL_IMAGE:-<mirror>}`
      # default — `:-` treats empty and unset alike, so an unset input keeps
      # the mirror rather than resolving to an empty image name.
      BC_SQL_IMAGE: ${{ inputs.sql_image }}
      BC_VERSION: ${{ inputs.bc_version }}
      BC_COUNTRY: ${{ inputs.bc_country }}
      BC_TYPE: ${{ inputs.bc_type }}
      # Where the extracted artifacts live. Job-level so the download step and
      # docker-compose's bind mount cannot disagree about the path — which is
      # what makes a warm cache visible to the container instead of being
      # re-downloaded into it.
      BC_ARTIFACTS_DIR: ${{ inputs.artifact_cache_dir != '' && inputs.artifact_cache_dir || format('{0}/artifact-cache', github.workspace) }}/${{ inputs.bc_version }}
      # Job-level for the same reason as BC_ARTIFACTS_DIR: the host downloads
      # from this URL and stamps the directory with it, and the container reads
      # that stamp. Step-scoped, only the download step saw it, so the container
      # asked for BC_TYPE/BC_VERSION/BC_COUNTRY instead and could not recognise
      # its own cache. Blank on every non-insider leg, which is the normal path.
      BC_ARTIFACT_URL: ${{ inputs.bc_artifact_url }}
      # ─── Which container stack on this machine is ours (issue #24) ───
      # Slot 0 keeps the historical identity exactly: project `bc-linux`, the
      # default ports from docker-compose.yml, and therefore the same named
      # volumes a self-hosted runner has already warmed. Raising the slot moves
      # the whole stack — project name AND every published port — so two jobs
      # can hold BC at once on one machine.
      #
      # Job-level rather than step-level for the same reason BC_ARTIFACTS_DIR
      # is: `docker compose`, `wait-for-bc-healthy.sh` and `run-tests.sh`'s
      # `docker compose exec` all have to agree about which project they are
      # talking to, and they run in different steps.
      COMPOSE_PROJECT_NAME: ${{ inputs.instance_slot == 0 && 'bc-linux' || format('bc-linux-{0}', inputs.instance_slot) }}

    steps:
      # ─── Phase 1: cheap parallel-friendly checkouts ──────────────────
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout MsDyn365Bc.On.Linux
        uses: actions/checkout@v4
        with:
          repository: StefanMaron/MsDyn365Bc.On.Linux
          ref: ${{ inputs.bc_linux_ref }}
          path: bc-linux

      - name: Initialize timing
        run: bash bc-linux/scripts/workflow-summary.sh init

      # ─── Phase 2: artifact download + docker image pull (parallel) ───
      # Downloading the BC artifact from Microsoft's CDN and pulling the
      # bc-runner / mssql images from GHCR / mcr are independent network
      # operations on different hosts. Run them in parallel inside one
      # shell step to overlap their wall time (~50s artifacts ⊕ ~30s pull
      # ⇒ ~50s instead of ~80s sequential).
      - name: Download BC artifacts + pull docker images (parallel)
        env:
          BC_RUNNER_IMAGE: ${{ inputs.runner_image }}
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin DOWNLOAD "Download BC artifacts + pull docker images"
          mkdir -p "$BC_ARTIFACTS_DIR"
          (
            # Two forms of download-artifacts.sh: the 2-arg form takes a
            # fully-qualified app URL and derives /platform from it (this is
            # the only way to reach the insider host, which the public index
            # resolver knows nothing about); the 4-arg form resolves a short
            # version against Microsoft's public index. Blank input keeps the
            # 4-arg form, i.e. exactly what consumers had before.
            if [ -n "$BC_ARTIFACT_URL" ]; then
              bc-linux/scripts/download-artifacts.sh \
                "$BC_ARTIFACT_URL" \
                "$BC_ARTIFACTS_DIR"
            else
              bc-linux/scripts/download-artifacts.sh \
                "$BC_TYPE" "$BC_VERSION" "$BC_COUNTRY" \
                "$BC_ARTIFACTS_DIR"
            fi
          ) &
          ARTIFACT_PID=$!
          (
            cd bc-linux
            # compose-pull.sh retries transient registry failures (mcr
            # occasionally WAF-blocks runner IPs) but aborts immediately
            # on a permanent one. The inline loop it replaced slept 15s x5
            # on "manifest unknown", turning a wrong or not-yet-published
            # tag into 60s of silent dead time.
            bash scripts/compose-pull.sh
          ) &
          PULL_PID=$!
          wait $ARTIFACT_PID || { echo "artifact download failed"; exit 1; }
          wait $PULL_PID     || { echo "docker pull failed"; exit 1; }
          bash bc-linux/scripts/workflow-summary.sh end DOWNLOAD

      # ─── Phase 3: figure out the BC_KEEP_APP_IDS for the entrypoint ──
      # Must run BEFORE 'docker compose up' so the env propagates into
      # the container's selective filter step at DB setup time.
      - name: Resolve apps to keep in BC database
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin RESOLVE "Resolve apps to keep"
          # Walk the consumer's app.json files (production + test) AND
          # bc-linux's own custom Test Runner Extension app.json to find
          # their declared dependencies, then resolve the transitive
          # closure against the BC artifact extension set. The closure
          # is added to the 5 baseline application stack apps (System /
          # System Application / Business Foundation / Base Application /
          # Application umbrella).
          #
          # The TestRunnerExtension app.json is included so its declared
          # dependency on Microsoft Test Runner gets walked into the
          # closure. Without this, the selective filter would wipe
          # Microsoft Test Runner and the entrypoint's TestRunnerExtension
          # publish would fail with AL1024 — exactly the bug that broke
          # the bc-copilot-blueprint debugging session before this fix.
          ARGS="--app-json bc-linux/extensions/TestRunnerExtension/app.json"
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if [ -f "project/$d/app.json" ]; then
              ARGS="$ARGS --app-json project/$d/app.json"
            fi
          done <<< "$APP_DIRS"$'\n'"$TEST_APP_DIRS"
          KEEP_IDS=$(python3 bc-linux/scripts/resolve-keep-app-ids.py \
            $ARGS \
            --artifact-dir "$BC_ARTIFACTS_DIR")
          echo "Resolved keep set: $KEEP_IDS"
          echo "BC_CLEAR_ALL_APPS=selective" >> "$GITHUB_ENV"
          echo "BC_KEEP_APP_IDS=$KEEP_IDS" >> "$GITHUB_ENV"
          bash bc-linux/scripts/workflow-summary.sh end RESOLVE

      # ─── Phase 3.5: stage the optional ISV license ───────────────────
      # When the consumer passed `bc_license` in the secrets: block, decode
      # the base64 blob to a tempfile and export the env vars that wire it
      # into the docker-compose mounts. The entrypoint will then import this
      # license INSTEAD of the default Cronus.bclicense, before NST starts —
      # no boot/import/restart cycle needed.
      #
      # We must NOT print the secret length, decoded path contents, or
      # anything else that could leak. Just write the file and propagate
      # the env vars.
      # We can NOT use `if: secrets.bc_license != ''` here — the `secrets`
      # context isn't allowed in step `if:` expressions (verified by
      # actionlint and confirmed by GitHub at parse time, which rejects
      # the entire workflow file). Reading the secret into env at step
      # level IS allowed, so we always run the step and skip its body
      # when the env var is empty. Same shape used in bc-test-prebuilt.yml.
      - name: Stage ISV license (if provided)
        env:
          BC_LICENSE_B64: ${{ secrets.bc_license }}
        run: |
          set -e
          if [ -z "${BC_LICENSE_B64:-}" ]; then
            echo "No bc_license secret provided — using default Cronus license"
            exit 0
          fi
          LICENSE_PATH="$RUNNER_TEMP/bc-license.bclicense"
          printf '%s' "$BC_LICENSE_B64" | base64 -d > "$LICENSE_PATH"
          if [ ! -s "$LICENSE_PATH" ]; then
            echo "ERROR: bc_license secret decoded to an empty file"
            exit 1
          fi
          # Make sure the SQL container's UID can read it (mssql runs as
          # uid 10001 by default; world-readable is the simplest thing
          # that works without messing with ownership).
          chmod 644 "$LICENSE_PATH"
          echo "BC_LICENSE_HOST_PATH=$LICENSE_PATH" >> "$GITHUB_ENV"
          echo "BC_LICENSE_FILE=/bc/custom-license.bclicense" >> "$GITHUB_ENV"
          echo "ISV license staged for entrypoint import"

      # ─── Phase 3.9: claim the container stack ────────────────────────
      # Everything from here to the end of the job drives containers whose
      # names and ports are shared by every job on this docker host. Take the
      # machine-wide lease first, so a job that arrives while this one is
      # mid-test queues instead of running `docker compose down` on our BC.
      #
      # Uncontended — which is every GitHub-hosted run, since the VM is ours
      # alone — this costs one file create. The step it protects is the next
      # one; the release is the last step of the job.
      #
      # The wait budget stops short of the job timeout so the failure is OUR
      # message ("the stack is in use by <job>") rather than GitHub's generic
      # cancellation, which is the exact confusion issue #24 was reported for.
      # ─── Resolve this job's port block (issue #24) ───────────────────
      # Shell, not a `${{ }}` expression, because the GitHub Actions expression
      # language has NO arithmetic operators — only grouping, index, deref,
      # comparison and boolean. `${{ 11433 + inputs.instance_slot * 100 }}` is
      # not a value that evaluates to 11433 at slot 0; it is a syntax error that
      # makes the whole workflow unloadable, so every caller fails instantly
      # with a zero-duration run named after the file. COMPOSE_PROJECT_NAME
      # stays a job-level expression because selecting between two strings
      # needs no arithmetic.
      #
      # Written to $GITHUB_ENV rather than job env so later steps still all
      # agree: docker compose, wait-for-bc-healthy.sh and run-tests.sh's
      # `docker compose exec` each run in their own step.
      - name: Resolve the container stack ports
        run: |
          set -e
          SLOT=${{ inputs.instance_slot }}
          OFF=$(( SLOT * 100 ))
          {
            echo "SQL_PORT=$(( 11433 + OFF ))"
            echo "BC_DEV_PORT=$(( 7049 + OFF ))"
            echo "BC_ODATA_PORT=$(( 7048 + OFF ))"
            echo "BC_API_PORT=$(( 7052 + OFF ))"
            echo "BC_MGMT_PORT=$(( 7045 + OFF ))"
            echo "BC_CLIENT_PORT=$(( 7085 + OFF ))"
            echo "BC_WEBCLIENT_PORT=$(( 8080 + OFF ))"
          } >> "$GITHUB_ENV"
          echo "slot $SLOT → project ${COMPOSE_PROJECT_NAME}, dev endpoint $(( 7049 + OFF ))"

      - name: Reserve the BC container stack on this machine
        run: |
          set -e
          WAIT=$(( ${{ inputs.timeout_minutes }} - 10 ))
          [ "$WAIT" -lt 5 ] && WAIT=5
          bash bc-linux/scripts/ci-lock.sh acquire "$COMPOSE_PROJECT_NAME" \
            --wait-minutes "$WAIT" \
            --max-hold-minutes ${{ inputs.timeout_minutes }}

      # ─── Phase 4: kick off BC startup in the background ──────────────
      # docker compose up -d returns immediately. BC then takes ~5 minutes
      # to fully boot. We do NOT wait for healthy here — instead the next
      # several steps (setup .NET, install AL, compile) run during that
      # boot window in parallel.
      - name: Start BC on Linux (background)
        working-directory: bc-linux
        run: |
          bash scripts/workflow-summary.sh begin BC_BOOT "BC startup (background → wait for healthy)"
          # Clear any leftover compose state before starting. On a GitHub-hosted
          # runner this is a no-op (fresh VM, nothing to remove). On a self-hosted
          # one the previous job's bc/sql containers may still be running, and
          # `docker compose up -d` adopts a running container instead of recreating
          # it — the healthcheck then goes green in seconds against the PREVIOUS
          # run's database and published apps, which looks like a very fast pass.
          # Named volumes are kept on purpose: the entrypoint stamps /bc/service
          # and reuses it only when it matches this platform + image, so the warm
          # path stays warm without going stale.
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d
          echo "BC container started in background — continuing with other work."

      # ─── Phase 5: work that runs DURING BC's startup window ──────────
      # Setup .NET, install the AL compiler, stage symbols, and compile
      # the consumer's AL apps. None of these need BC to be responsive,
      # so they overlap with the slow `docker compose up` startup time.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install AL compiler (Linux)
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin AL_INSTALL "Install AL compiler"
          # Resolution, package-shape fallback (Microsoft has been known to
          # reshuffle where the compiler binary lives inside a BC preview's
          # AL nupkg without warning — see install-al-compiler.sh's header
          # for the specific incident this guards against) and the AL
          # wrapper all live in the shared script so this logic exists in
          # exactly one place across the reusable workflow and both
          # examples/ pipelines.
          if ! INSTALL_OUT=$(bash bc-linux/scripts/install-al-compiler.sh "${{ inputs.bc_version }}" "${{ inputs.al_tool_version }}"); then
            exit 1
          fi
          eval "$INSTALL_OUT"
          echo "$AL_BIN_DIR" >> "$GITHUB_PATH"
          echo "AL_TOOL_DIR=$AL_TOOL_DIR" >> "$GITHUB_ENV"
          echo "AL compiler ready: $AL_TOOL_DIR"
          bash bc-linux/scripts/workflow-summary.sh end AL_INSTALL

      # ─── altool test runner (BC 28+) ─────────────────────────────────
      # Installs the cross-platform Microsoft.Dynamics.BusinessCentral.
      # Development.Tools dotnet tool whose `al runtests` command drives
      # the NST's built-in /dev/TestRunnerHub SignalR hub. This is a
      # DIFFERENT package from the .Linux compiler package above (that one
      # only compiles). The hub requires Dev API 7.0, which only ships
      # with BC 28.0+:
      #   - test_runner=altool on an older version → hard error here
      #     (forcing altool is the "catch hub regressions" mode)
      #   - test_runner=auto on an older version → skip the install; the
      #     run step's live probe will route to the websocket runner
      - name: Install AL dotnet tool (altool test runner)
        if: inputs.test_runner != 'websocket'
        run: |
          set -e
          BC_MAJOR=$(echo "${{ inputs.bc_version }}" | cut -d. -f1)
          if [ "$BC_MAJOR" -lt 28 ]; then
            if [ "${{ inputs.test_runner }}" = "altool" ]; then
              echo "ERROR: test_runner=altool requires BC 28.0+ — the server-side"
              echo "       /dev/TestRunnerHub (Dev API 7.0) does not exist in BC ${BC_MAJOR}.x."
              echo "       Use test_runner=auto (probes + falls back) or websocket."
              exit 1
            fi
            echo "test_runner=auto on BC ${BC_MAJOR}.x — skipping altool install;"
            echo "tests will use the websocket runner."
            exit 0
          fi
          dotnet tool install -g Microsoft.Dynamics.BusinessCentral.Development.Tools \
            --version "${{ inputs.altool_version }}" \
          || dotnet tool update -g Microsoft.Dynamics.BusinessCentral.Development.Tools \
            --version "${{ inputs.altool_version }}"
          # The tool registers the lowercase `al` command. The AL compiler
          # install step above may create an UPPERCASE `AL` wrapper for the
          # compile path — the test step invokes this one by absolute path
          # ($HOME/.dotnet/tools/al) so there's no case-collision ambiguity.
          "$HOME/.dotnet/tools/al" runtests --help >/dev/null
          echo "altool test runner ready: $("$HOME/.dotnet/tools/al" --version)"

      - name: Stage symbols from BC artifacts
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin SYMBOLS "Stage symbols"
          mkdir -p symbols
          # Manifest-driven resolver: walks the artifact tree, indexes
          # every .app by its declared id, then stages exactly the
          # transitive dependency closure of the consumer's app.json
          # files (plus System.app, which AL compile always needs).
          # Robust to Microsoft moving apps between folders across BC
          # versions — the old glob-based staging silently failed
          # whenever an expected app moved (e.g. Tests-TestLibraries
          # under platform/applications/BaseApp/Test/ in BC 27.5).
          ARGS=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            [ -f "project/$d/app.json" ] && ARGS="$ARGS --app-json project/$d/app.json"
          done <<< "$APP_DIRS"$'\n'"$TEST_APP_DIRS"
          python3 bc-linux/scripts/stage-symbols.py \
            $ARGS \
            --artifact-dir "$BC_ARTIFACTS_DIR" \
            --out-dir symbols \
            || true   # warnings about unresolved deps are non-fatal; AL compile gives the precise error if any
          echo "Staged $(ls symbols/*.app 2>/dev/null | wc -l) symbol files"
          bash bc-linux/scripts/workflow-summary.sh end SYMBOLS

      # Opt-in. Third-party dependency symbols (e.g. an AppSource dependency published
      # in another repo) that "Stage symbols from BC artifacts" above can't resolve,
      # since it only indexes the Microsoft BC platform artifact tree. The caller
      # uploads these as a workflow-run artifact in an earlier job; merge them into the
      # same symbols/ dir so compile_dir's `cp symbols/*.app` picks them up like any
      # other staged symbol.
      - name: Download extra dependency symbols
        if: ${{ inputs.extra_symbols_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extra_symbols_artifact_name }}
          path: extra-symbols

      - name: Merge extra dependency symbols
        if: ${{ inputs.extra_symbols_artifact_name != '' }}
        env:
          SUBDIR: ${{ inputs.extra_symbols_artifact_subdir }}
        run: |
          SRC="extra-symbols"
          [ -n "$SUBDIR" ] && SRC="extra-symbols/$SUBDIR"
          if [ ! -d "$SRC" ]; then
            echo "::warning::extra_symbols_artifact_name was set but '$SRC' does not exist in the downloaded artifact — nothing merged."
          else
            COUNT=$(find "$SRC" -maxdepth 1 -name '*.app' | wc -l)
            cp "$SRC"/*.app symbols/ 2>/dev/null || true
            echo "Merged $COUNT extra dependency symbol(s) from $SRC into symbols/"
          fi

      # Opt-in only. A consumer's declared runtime is a real compatibility
      # statement (e.g. target "Internal" requires runtime < 11.0) — rewriting
      # it silently breaks such projects, so blank means hands off and any
      # runtime/BC mismatch surfaces as the AL compiler's own error.
      - name: Patch app.json runtime
        if: ${{ inputs.runtime_version != '' }}
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          EFFECTIVE_RUNTIME="$RUNTIME_VERSION"
          BC_MAJOR=$(echo "${{ inputs.bc_version }}" | cut -d. -f1)
          if [ "$EFFECTIVE_RUNTIME" = "auto" ]; then
            # Same BC-major-minus-11 rule as the compiler version; no network
            # call needed for this one. The old table's fallback to 14.0 for
            # an unknown major was silently wrong for anything newer than 28.
            if ! EFFECTIVE_RUNTIME=$(python3 bc-linux/scripts/resolve-al-tool-version.py "${{ inputs.bc_version }}" --runtime); then
              echo "::error::could not resolve an AL runtime version for BC ${{ inputs.bc_version }}"
              exit 1
            fi
          fi
          echo "Patching app.json runtime → $EFFECTIVE_RUNTIME"
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            F="project/$d/app.json"
            [ -f "$F" ] || continue
            python3 - "$F" "$EFFECTIVE_RUNTIME" <<'PYEOF'
          import sys, json, pathlib
          p = pathlib.Path(sys.argv[1])
          d = json.loads(p.read_text())
          if d.get("runtime") != sys.argv[2]:
              d["runtime"] = sys.argv[2]
              p.write_text(json.dumps(d, indent=2) + "\n")
              print(f"  patched {p}: runtime → {sys.argv[2]}")
          else:
              print(f"  {p}: runtime already {sys.argv[2]}, skip")
          PYEOF
          done <<< "$APP_DIRS"$'\n'"$TEST_APP_DIRS"

      # Opt-in only. Mirrors AL-Go's own Update-AppJsonProperties (called
      # from Compile.ps1 before every Windows build) — a caller like AL-Go
      # can pass its already-computed major.minor/build/revision straight
      # through so a Linux compile produces a version that keeps climbing
      # run over run, the same way the Windows path already does. Without
      # this, every compile reuses whatever version is committed in
      # app.json, BC's Deploy step sees it as no higher than what's already
      # installed, and skips the app. See issue #38.
      - name: Patch app.json version
        if: ${{ inputs.app_version_major_minor != '' || inputs.app_version_build != 0 || inputs.app_version_revision != 0 }}
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
          MAJOR_MINOR: ${{ inputs.app_version_major_minor }}
          BUILD_NUMBER: ${{ inputs.app_version_build }}
          REVISION_NUMBER: ${{ inputs.app_version_revision }}
        run: |
          echo "Patching app.json version: major.minor=${MAJOR_MINOR:-<unchanged>} build=${BUILD_NUMBER:-<unchanged>} revision=${REVISION_NUMBER:-<unchanged>}"
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            F="project/$d/app.json"
            [ -f "$F" ] || continue
            python3 - "$F" "$MAJOR_MINOR" "$BUILD_NUMBER" "$REVISION_NUMBER" <<'PYEOF'
          import sys, json, pathlib
          p = pathlib.Path(sys.argv[1])
          major_minor, build, revision = sys.argv[2], sys.argv[3], sys.argv[4]
          d = json.loads(p.read_text())
          parts = d.get("version", "1.0.0.0").split(".")
          while len(parts) < 4:
              parts.append("0")
          if major_minor:
              mm = major_minor.split(".")
              if len(mm) != 2 or not all(mm):
                  print(f"::error::app_version_major_minor must be 'MAJOR.MINOR' (e.g. '27.0'), got: {major_minor!r}")
                  sys.exit(1)
              parts[0], parts[1] = mm[0], mm[1]
          if build and build != "0":
              parts[2] = build
          if revision and revision != "0":
              parts[3] = revision
          new_version = ".".join(parts)
          if d.get("version") != new_version:
              d["version"] = new_version
              p.write_text(json.dumps(d, indent=2) + "\n")
              print(f"  patched {p}: version → {new_version}")
          else:
              print(f"  {p}: version already {new_version}, skip")
          PYEOF
          done <<< "$APP_DIRS"$'\n'"$TEST_APP_DIRS"

      - name: Compile AL apps (no publish yet)
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
          ENABLE_CODE_COP: ${{ inputs.enable_code_cop }}
          ENABLE_UI_COP: ${{ inputs.enable_ui_cop }}
          ENABLE_APP_SOURCE_COP: ${{ inputs.enable_app_source_cop }}
          ENABLE_PER_TENANT_EXTENSION_COP: ${{ inputs.enable_per_tenant_extension_cop }}
          CUSTOM_CODE_COPS: ${{ inputs.custom_code_cops }}
          RULESET_FILE: ${{ inputs.ruleset_file }}
          ENABLE_EXTERNAL_RULESETS: ${{ inputs.enable_external_rulesets }}
          ENABLE_CODE_ANALYZERS_ON_TEST_APPS: ${{ inputs.enable_code_analyzers_on_test_apps }}
          PREPROCESSOR_SYMBOLS: ${{ inputs.preprocessor_symbols }}
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin COMPILE "Compile AL apps"

          # ─── Resolve analyzer flags via the helper ─────────────────────
          # Build the helper invocation only when SOMETHING is configured.
          # When nothing is set, ANALYZER_FLAGS stays empty and the compile
          # commands run exactly as they did before these inputs existed.
          HELPER_ARGS=()
          [ "$ENABLE_CODE_COP" = "true" ] && HELPER_ARGS+=(--enable-code-cop)
          [ "$ENABLE_UI_COP" = "true" ] && HELPER_ARGS+=(--enable-ui-cop)
          [ "$ENABLE_APP_SOURCE_COP" = "true" ] && HELPER_ARGS+=(--enable-app-source-cop)
          [ "$ENABLE_PER_TENANT_EXTENSION_COP" = "true" ] && HELPER_ARGS+=(--enable-per-tenant-extension-cop)
          [ -n "$CUSTOM_CODE_COPS" ] && HELPER_ARGS+=(--custom-code-cops "$CUSTOM_CODE_COPS")
          [ -n "$RULESET_FILE" ] && HELPER_ARGS+=(--ruleset-file "$RULESET_FILE")
          [ "$ENABLE_EXTERNAL_RULESETS" = "true" ] && HELPER_ARGS+=(--enable-external-rulesets)

          # Run the helper to a tempfile rather than via process substitution.
          # `mapfile -t < <(python3 ...)` SILENTLY SWALLOWS the helper's exit
          # code — if the helper bails on a missing path or download error,
          # mapfile just gets an empty array, ANALYZER_FLAGS stays empty, the
          # compile runs WITHOUT any cops, and the workflow reports a green
          # build with zero analyzer enforcement. Exactly the false-green
          # failure mode the load-failure guard is supposed to prevent —
          # but the load-failure guard only fires DURING compile, so a
          # helper crash BEFORE compile slips past it.
          # The pass --project-root project so consumer-supplied paths
          # (which are written relative to their repo root) get prepended
          # with the project/ checkout dir. URLs pass through untouched.
          ANALYZER_FLAGS=()
          if [ ${#HELPER_ARGS[@]} -gt 0 ]; then
            HELPER_OUT=$(mktemp)
            if ! python3 bc-linux/scripts/resolve-analyzers.py \
                --project-root project \
                ${AL_TOOL_DIR:+--al-tool-dir "$AL_TOOL_DIR"} \
                "${HELPER_ARGS[@]}" > "$HELPER_OUT"; then
              echo "ERROR: resolve-analyzers.py failed — check stderr above" >&2
              rm -f "$HELPER_OUT"
              exit 1
            fi
            mapfile -t ANALYZER_FLAGS < "$HELPER_OUT"
            rm -f "$HELPER_OUT"
            echo "Analyzer flags: ${ANALYZER_FLAGS[*]}"
          else
            echo "No analyzers configured — compiling without /analyzer or /ruleset flags."
          fi

          # Pattern that catches every "analyzer DLL didn't load properly"
          # failure mode the AL compiler reports. These are emitted as
          # WARNINGS (AD0001 specifically) so AL compile still exits 0
          # — without this guard, a misconfigured analyzer would silently
          # disable itself and the workflow would report a green build
          # with no cops enforced. Failing here is the only way the
          # consumer learns their cop wiring is broken.
          ANALYZER_LOAD_FAIL_PATTERN='AD0001|Could not load|BadImageFormatException|PlatformNotSupportedException'

          PP_FLAG=()
          [ -n "$PREPROCESSOR_SYMBOLS" ] && PP_FLAG=("/define:$PREPROCESSOR_SYMBOLS")

          compile_dir() {
            local src="$1"
            shift
            [ -f "$src/app.json" ] || { echo "skip $src (no app.json)" >&2; return 0; }
            mkdir -p "$src/.alpackages"
            cp symbols/*.app "$src/.alpackages/" 2>/dev/null || true
            local out
            out="$(pwd)/build/$(basename "$src").app"
            mkdir -p build
            echo ">>> Compiling $src → $out"
            # Remaining args ($@) are the analyzer flag fragments — may be empty.
            # When analyzers are configured, capture output so we can grep
            # for load failures after the compile succeeds. When not, let
            # AL compile write straight to stdout/stderr (cheaper, simpler
            # output, same behavior as before this feature existed).
            if [ "$#" -gt 0 ]; then
              local tmplog rc
              tmplog=$(mktemp)
              AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}" "$@" 2>&1 | tee "$tmplog"
              # tee always exits 0; capture AL compile's real exit code.
              rc=${PIPESTATUS[0]}
              if [ "$rc" -ne 0 ]; then
                rm -f "$tmplog"
                return $rc
              fi
              if grep -qE "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog"; then
                echo "ERROR: analyzer load failure detected in compile output for $src" >&2
                echo "       (cop DLL did not initialize correctly — see lines below)" >&2
                grep -E "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog" >&2
                rm -f "$tmplog"
                return 1
              fi
              rm -f "$tmplog"
            else
              AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}"
            fi
          }

          # Compile production apps first so test apps can resolve them as deps.
          # Production apps always get the analyzer flags (when configured).
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            mkdir -p "project/$d/.alpackages"
            cp build/*.app "project/$d/.alpackages/" 2>/dev/null || true
            compile_dir "project/$d" "${ANALYZER_FLAGS[@]}"
          done <<< "$APP_DIRS"

          # Test apps get analyzer flags only when explicitly opted in via
          # enable_code_analyzers_on_test_apps. AL-Go's default is false
          # (analyzers don't run on test apps) and we mirror that so the
          # behavior matches what consumers see today.
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            mkdir -p "project/$d/.alpackages"
            cp build/*.app "project/$d/.alpackages/" 2>/dev/null || true
            if [ "$ENABLE_CODE_ANALYZERS_ON_TEST_APPS" = "true" ]; then
              compile_dir "project/$d" "${ANALYZER_FLAGS[@]}"
            else
              compile_dir "project/$d"
            fi
          done <<< "$TEST_APP_DIRS"

          bash bc-linux/scripts/workflow-summary.sh end COMPILE

      # Staged right after compile (before publish/test) so the compiled
      # apps are available for upload even if a later step fails. Skipped
      # entirely when artifact_name_suffix is blank — see that input's
      # description for the uniqueness contract callers must uphold.
      # The staging dir deliberately does NOT start with a dot. upload-artifact@v4
      # silently excludes hidden files/directories unless include-hidden-files is
      # set — a leading-dot name here previously made `cp` succeed and the upload
      # step report "No files were found" for a directory that was never empty.
      - name: Stage compiled apps for upload
        if: ${{ inputs.artifact_name_suffix != '' }}
        env:
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
        run: |
          set -e
          mkdir -p artifact-staging/Apps artifact-staging/TestApps
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            f="build/$(basename "$d").app"
            [ -f "$f" ] && cp "$f" artifact-staging/Apps/
          done <<< "$APP_DIRS"
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            f="build/$(basename "$d").app"
            [ -f "$f" ] && cp "$f" artifact-staging/TestApps/
          done <<< "$TEST_APP_DIRS"
          echo "Staged files:"
          find artifact-staging -type f

      - name: Upload compiled apps artifact
        if: ${{ inputs.artifact_name_suffix != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bc-linux-build-${{ inputs.artifact_name_suffix }}
          path: artifact-staging/
          if-no-files-found: error

      # ─── Phase 6: synchronization point — wait for BC to be healthy ──
      - name: Wait for BC healthy
        working-directory: bc-linux
        run: |
          ./scripts/wait-for-bc-healthy.sh ${{ inputs.health_timeout_minutes }}
          bash scripts/workflow-summary.sh end BC_BOOT

      # Opt-in (see verify_authentication input below). When enabled, this
      # must run before the positive-only publish/smoke path: the former
      # Patch #16b made every later step green even with a wrong password.
      - name: Verify NavUserPassword authentication
        if: ${{ inputs.verify_authentication }}
        working-directory: bc-linux
        run: ./scripts/test-authentication.sh

      # ─── Phase 7: publish compiled apps to the now-running BC ────────
      - name: Publish AL apps to BC
        env:
          AUTH: "BCRUNNER:Admin123!"
          # Built in the shell below rather than pinned here: BC_DEV_PORT moves
          # with instance_slot, and a step-level `env:` cannot expand another
          # env var.
          APP_DIRS: ${{ inputs.app_dirs }}
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
          EXTRA_SYMBOLS_ARTIFACT_NAME: ${{ inputs.extra_symbols_artifact_name }}
          EXTRA_SYMBOLS_ARTIFACT_SUBDIR: ${{ inputs.extra_symbols_artifact_subdir }}
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin PUBLISH "Publish AL apps"
          DEV="http://localhost:${BC_DEV_PORT}/BC/dev"
          # Source the canonical publish helper from bc-linux. Previously
          # this step had its own inline publish_app that treated EVERY
          # 422 as success, which silently swallowed missing-dependency
          # errors (e.g. AL1024 "Symbols for the requested app X could
          # not be found in the database") and let downstream test runs
          # produce "0 total, 0 passed, 0 failed" with no clue why.
          # bc_publish_app reads the response body and only treats 422
          # as success if it actually says "already".
          # shellcheck disable=SC1091
          . bc-linux/scripts/publish-app.sh
          PUBLISHED_COUNT=0
          # Third-party dependencies (extra_symbols_artifact_name) only got merged into
          # symbols/ for AL compile's benefit. BC also needs them actually INSTALLED,
          # not just resolvable as symbols, or the consumer's own app publish fails with
          # AL1024 ("Symbols for the requested app X could not be found in the
          # database") even though compile succeeded. Publish them first so the
          # consumer's apps can depend on them.
          if [ -n "$EXTRA_SYMBOLS_ARTIFACT_NAME" ]; then
            EXTRA_SRC="extra-symbols"
            [ -n "$EXTRA_SYMBOLS_ARTIFACT_SUBDIR" ] && EXTRA_SRC="extra-symbols/$EXTRA_SYMBOLS_ARTIFACT_SUBDIR"
            for app in "$EXTRA_SRC"/*.app; do
              [ -f "$app" ] || continue
              echo ">>> Publishing dependency $app"
              bc_publish_app "$app" "$DEV" "$AUTH" || exit 1
              PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
            done
          fi
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            app="build/$(basename "$d").app"
            [ -f "$app" ] || { echo "missing: $app"; exit 1; }
            echo ">>> Publishing $app"
            bc_publish_app "$app" "$DEV" "$AUTH" || exit 1
            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
          done <<< "$APP_DIRS"$'\n'"$TEST_APP_DIRS"
          bash bc-linux/scripts/workflow-summary.sh count apps_published "$PUBLISHED_COUNT"
          # Track compile count too — same loop iteration shape, runs after compile.
          COMPILED_COUNT=$(ls build/*.app 2>/dev/null | wc -l)
          bash bc-linux/scripts/workflow-summary.sh count apps_compiled "$COMPILED_COUNT"
          bash bc-linux/scripts/workflow-summary.sh end PUBLISH

      - name: Run AL tests
        working-directory: bc-linux
        env:
          TEST_APP_DIRS: ${{ inputs.test_app_dirs }}
          TEST_COMPANY: ${{ inputs.test_company }}
        run: |
          set -e
          bash scripts/workflow-summary.sh begin TESTS "Run AL tests"
          # Iterate only the test apps (we know which ones from TEST_APP_DIRS).
          # Production apps in APP_DIRS are already published but their .app
          # files aren't fed to run-tests.sh because they have no test codeunits.
          TESTS_TOTAL=0
          TESTS_PASSED=0
          TESTS_FAILED=0
          CODEUNITS_TOTAL=0
          # NOTE on the pipe: `run-tests.sh ... | tee` hides run-tests.sh's
          # exit code behind tee's (always 0). PIPESTATUS captures the
          # original. Without this check, even a hard publish failure or
          # an empty test suite leaves the workflow green — which is
          # exactly the bug that wasted multiple debugging cycles in the
          # bc-copilot-blueprint session.
          ANY_TEST_FAILED=0
          # Company names contain spaces ("CRONUS International Ltd."), so
          # this has to be an array — `${TEST_COMPANY:+--company
          # "$TEST_COMPANY"}` expands unquoted and would hand the runner
          # four separate arguments.
          COMPANY_ARGS=()
          if [ -n "${TEST_COMPANY:-}" ]; then
            COMPANY_ARGS=(--company "$TEST_COMPANY")
          fi
          # ─── Select the effective test runner ─────────────────────────
          # "auto" probes the LIVE server (BC is healthy at this point):
          # GET /dev/metadata must advertise Dev API 7.0+ for the
          # TestRunnerHub to exist, AND the al tool must have been
          # installed (the install step skips it on BC < 28). Anything
          # short of both → websocket. Explicit values pass through:
          # "altool" without server support fails inside the script with
          # a clear error instead of silently degrading.
          EFFECTIVE_RUNNER="${{ inputs.test_runner }}"
          if [ "$EFFECTIVE_RUNNER" = "auto" ]; then
            if [ -x "$HOME/.dotnet/tools/al" ] \
               && python3 scripts/run-tests-altool.py --probe --port "$BC_DEV_PORT"; then
              EFFECTIVE_RUNNER="hybrid"
              echo "auto: server supports the TestRunnerHub — splitting codeunits"
              echo "      between the altool and websocket runners (see issue #27)"
            else
              EFFECTIVE_RUNNER="websocket"
              echo "auto: TestRunnerHub not available — using the websocket runner"
            fi
          fi
          # Per-app JUnit XML output. Always emitted (no opt-in flag) — JUnit is
          # cheap, the file is small, and downstream consumers either ingest it
          # via the upload-artifact step below OR via their own steps that read
          # the workspace path. AL-Go's AnalyzeTests post-step looks for these
          # files at consumer-controlled paths, so we put them somewhere
          # predictable: ../build/junit-<test-app-basename>.xml relative to
          # the bc-linux working dir (= ./build/junit-* relative to the
          # consumer's repo root after the workflow finishes).
          mkdir -p ../build
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            app="../build/$(basename "$d").app"
            [ -f "$app" ] || { echo "skip: $app (not built)"; continue; }
            base=$(basename "$app")
            junit_file="../build/junit-$(basename "$d").xml"
            echo "=== Running tests in $base ==="
            # Capture output so we can parse the totals for telemetry.
            tmplog=$(mktemp)
            if [ "$EFFECTIVE_RUNNER" = "hybrid" ]; then
              # BC 28+, test_runner=auto: split this app's codeunits between
              # the fast altool path and the classic websocket path per
              # scripts/classify-handler-codeunits.py's static scan of $d
              # (this test app's AL source dir) — see issue #27. Nothing
              # runs twice; each codeunit goes to exactly one runner.
              #
              # python3 -u: without it Python block-buffers stdout through
              # the `| tee`, so results land in ~8KB batches and every
              # timestamp in the log is the flush time, not the event time.
              # That made a 3s startup look like 33s when reading the log.
              python3 -u scripts/run-tests-hybrid.py \
                --app "$app" \
                --al-source-dir "../project/$d" \
                --codeunit-range "${{ inputs.codeunit_range }}" \
                --junit-output "$junit_file" \
                --altool-cmd "$HOME/.dotnet/tools/al" \
                --port "$BC_DEV_PORT" \
                --base-url "http://localhost:${BC_ODATA_PORT}/BC" \
                --dev-url "http://localhost:${BC_DEV_PORT}/BC/dev" \
                --api-port "$BC_API_PORT" \
                "${COMPANY_ARGS[@]}" \
                --timeout 30 2>&1 | tee "$tmplog"
            elif [ "$EFFECTIVE_RUNNER" = "altool" ]; then
              # test_runner=altool (explicit force): EVERY codeunit through
              # the hub, no split — this is the "catch hub regressions"
              # mode, so it must not silently reroute anything. The script
              # prints the same "N total, P passed, F failed" and "Test
              # codeunits:" lines as run-tests.sh, so the parsing below
              # works for both.
              # --transport auto: one persistent TestRunnerHub connection for
              # all codeunits (~0.4s saved per codeunit vs spawning `al
              # runtests` each time), falling back to the per-codeunit CLI
              # path if the hub connection can't be established.
              python3 -u scripts/run-tests-altool.py \
                --app "$app" \
                --codeunit-range "${{ inputs.codeunit_range }}" \
                --junit-output "$junit_file" \
                --altool-cmd "$HOME/.dotnet/tools/al" \
                --transport auto \
                --port "$BC_DEV_PORT" \
                --base-url "http://localhost:${BC_ODATA_PORT}/BC" \
                --api-port "$BC_API_PORT" \
                "${COMPANY_ARGS[@]}" \
                --timeout 30 2>&1 | tee "$tmplog"
            else
              ./scripts/run-tests.sh \
                --app "$app" \
                --codeunit-range "${{ inputs.codeunit_range }}" \
                --junit-output "$junit_file" \
                --base-url "http://localhost:${BC_ODATA_PORT}/BC" \
                --dev-url "http://localhost:${BC_DEV_PORT}/BC/dev" \
                "${COMPANY_ARGS[@]}" \
                --timeout 30 2>&1 | tee "$tmplog"
            fi
            RUN_TESTS_RC=${PIPESTATUS[0]}
            if [ "$RUN_TESTS_RC" -ne 0 ]; then
              echo "ERROR: test runner ($EFFECTIVE_RUNNER) exited with code $RUN_TESTS_RC for $base"
              ANY_TEST_FAILED=1
            fi
            # Parse "N total, P passed, F failed, ..." from run-tests.sh output.
            line=$(grep -oE '[0-9]+ total, [0-9]+ passed, [0-9]+ failed' "$tmplog" | tail -1 || true)
            if [ -n "$line" ]; then
              t=$(echo "$line" | grep -oE '^[0-9]+')
              p=$(echo "$line" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
              f=$(echo "$line" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
              TESTS_TOTAL=$((TESTS_TOTAL + ${t:-0}))
              TESTS_PASSED=$((TESTS_PASSED + ${p:-0}))
              TESTS_FAILED=$((TESTS_FAILED + ${f:-0}))
            fi
            cu=$(grep -oE 'Test codeunits: [^ ]+' "$tmplog" | head -1 | sed 's/Test codeunits: //')
            if [ -n "$cu" ]; then
              n=$(echo "$cu" | tr ',' '\n' | grep -c .)
              CODEUNITS_TOTAL=$((CODEUNITS_TOTAL + n))
            fi
            rm -f "$tmplog"
          done <<< "$TEST_APP_DIRS"
          bash scripts/workflow-summary.sh count tests_total    "$TESTS_TOTAL"
          bash scripts/workflow-summary.sh count tests_passed   "$TESTS_PASSED"
          bash scripts/workflow-summary.sh count tests_failed   "$TESTS_FAILED"
          bash scripts/workflow-summary.sh count codeunits_total "$CODEUNITS_TOTAL"
          bash scripts/workflow-summary.sh end TESTS
          # Propagate any non-zero exit from run-tests.sh (PIPESTATUS check
          # above), AND any test failures parsed from the per-app output.
          # Either condition fails the workflow.
          if [ "$ANY_TEST_FAILED" -ne 0 ]; then
            echo "ERROR: at least one test runner invocation exited non-zero"
            exit 1
          fi
          if [ "$TESTS_FAILED" -gt 0 ]; then
            echo "ERROR: $TESTS_FAILED test(s) failed"
            exit 1
          fi
          if [ "$TESTS_TOTAL" -eq 0 ]; then
            echo "ERROR: no tests ran (TESTS_TOTAL=0). Either the test app"
            echo "       failed to install or the test framework didn't see"
            echo "       any [Test] procedures."
            exit 1
          fi

      # Upload per-app JUnit XML as a workflow artifact even on test failure
      # (if: always()). Consumers can:
      #   - Download from the run summary page for offline inspection
      #   - Pull it from another job in the same workflow via actions/download-artifact
      #   - Feed it to dorny/test-reporter or EnricoMi/publish-unit-test-result-action
      #     in a follow-up step on their side (we don't auto-publish to GitHub
      #     Checks here because each consumer may want a different reporter
      #     UX or none at all)
      #
      # Name MUST include bc_version because actions/upload-artifact@v4 errors
      # if multiple matrix jobs in the same workflow run try to upload to the
      # same artifact name. test-versions.yml's matrix calls this reusable
      # workflow once per BC version; without the suffix every job after the
      # first one would fail with "409 Conflict".
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results-${{ inputs.bc_version }}
          path: build/junit-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Workflow timing summary + telemetry
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          # Opt out of anonymous performance telemetry by setting this to "true"
          # in your workflow's env block. Default is to send (helps build the
          # case for native Linux BC support to Microsoft).
          BC_TELEMETRY_OPT_OUT: ${{ vars.BC_TELEMETRY_OPT_OUT || 'false' }}
        run: bash bc-linux/scripts/workflow-summary.sh emit

      - name: BC logs (on failure)
        if: failure()
        working-directory: bc-linux
        run: |
          echo "=== entrypoint.sh + selective filter output ==="
          docker compose logs bc 2>&1 | grep -E "\[entrypoint\]|Selective|KEEP:|BC_CLEAR_ALL_APPS|BC_KEEP_APP_IDS|test framework|Library Assert|Microsoft_Any|Microsoft_Test Runner" || true
          echo ""
          echo "=== last 500 lines of bc-1 ==="
          docker compose logs bc 2>&1 | tail -500

      # Last step in the job, and after the log dump above — the containers
      # have to still be ours while that runs. `if: always()` so a failed test
      # run doesn't leave the next job queueing for two minutes waiting for the
      # lease to go stale. Deliberately no `docker compose down`: the next job
      # does its own, and leaving the stack up is what keeps the warm-volume
      # path warm on a self-hosted runner.
      - name: Release the BC container stack
        if: always()
        run: bash bc-linux/scripts/ci-lock.sh release "$COMPOSE_PROJECT_NAME"
