name: Test BC Versions

# Matrix-tests every supported BC version end-to-end against a real
# test extension (extensions/smoke-test/) by reusing the canonical
# bc-test-from-source.yml workflow. There used to be ~150 lines of
# inline compile/publish/test logic in this file that duplicated
# (and silently broke) features the reusable workflow already provides:
#  - start-do-wait parallelism (BC boots while AL compile runs)
#  - 422-body-inspecting publish helper
#  - shared wait-for-bc-healthy script
#  - hard fail when TESTS_TOTAL is 0
# After the bc-copilot-blueprint debugging session uncovered all of those,
# the cleanest fix was to just use the reusable workflow here too.
#
# The matrix is ROLLING, not hardcoded. scripts/discover-bc-versions.py
# reads Microsoft's artifact indexes at run time and produces two groups:
#
#   test          REQUIRED. Released versions from the public sandbox index,
#                 newest `majors_back` majors (default 2 → 27 and 28 today).
#                 A failure here is a real bc-linux regression.
#
#   test-preview  NON-BLOCKING. The next major and the next minor from the
#                 INSIDER index, fed in as a full BC_ARTIFACT_URL. These are
#                 early warning about unreleased BC builds; the next-major
#                 leg is expected to fail today (BC 29 targets .NET 10, the
#                 bc-runner image ships .NET 8).
#
# The `versions:` dispatch input still short-circuits both: pass
# "27.0,28.1" and you get exactly those two legs and no preview.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'BC versions to test (comma-separated, e.g. "27.0,28.1"). Overrides discovery entirely — you get exactly these legs and no preview legs.'
        required: false
        default: ''
        type: string
      majors_back:
        description: 'How many of the newest BC majors the REQUIRED matrix covers (2 = today''s 27 + 28). Used when "versions" is empty.'
        required: false
        default: '2'
        type: string
      include_preview:
        description: 'Also run the non-blocking insider preview legs (next major + next minor). Ignored when "versions" is set.'
        required: false
        default: true
        type: boolean
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, Monday 03:00 UTC. Catches new BC sandbox releases (Microsoft
    # ships minor versions on its own cadence) without anyone remembering
    # to bump the matrix by hand.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  # Needed to pull runner_image from GHCR in reusable workflow/test jobs.
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      preview_matrix: ${{ steps.set.outputs.preview_matrix }}
      has_preview: ${{ steps.set.outputs.has_preview }}
      alcops_url: ${{ steps.alcops.outputs.url }}
    steps:
    - uses: actions/checkout@v4

    - id: set
      name: Discover BC version matrix
      env:
        # Only workflow_dispatch supplies these; on push/PR/schedule they
        # evaluate to empty and the defaults below apply.
        VERSIONS: ${{ inputs.versions }}
        MAJORS_BACK: ${{ inputs.majors_back }}
        # Preview legs are on by default everywhere except when a dispatch
        # explicitly unticks the box. `inputs.include_preview` is empty (not
        # 'true') on push/PR/schedule, hence the event_name guard.
        INCLUDE_PREVIEW: ${{ github.event_name != 'workflow_dispatch' || inputs.include_preview }}
      run: |
        set -euo pipefail
        # Single write per output key at the end of each branch — GitHub's
        # behavior on a duplicated key is not worth relying on.
        PREVIEW='{"include":[]}'
        HAS_PREVIEW=false

        if [ -n "$VERSIONS" ]; then
          # Explicit override: exactly these legs, no discovery, no preview.
          # Someone debugging one version should not also pay for two
          # insider boots.
          echo "Explicit versions requested: $VERSIONS"
          JSON=$(VERSIONS="$VERSIONS" python3 -c "import os,json; print(json.dumps({'bc_version':[v.strip() for v in os.environ['VERSIONS'].split(',') if v.strip()]}))")
          {
            echo "matrix=$JSON"
            echo "preview_matrix=$PREVIEW"
            echo "has_preview=$HAS_PREVIEW"
          } >> "$GITHUB_OUTPUT"
          echo "Required matrix: $JSON"
          exit 0
        fi

        # Rolling discovery. scripts/discover-bc-versions.py reads the same
        # per-country index file scripts/download-artifacts.sh resolves
        # against, so the matrix and the actual download always agree on
        # what "latest" means, and emits SHORT versions so a hotfix landing
        # mid-run is picked up rather than skipped.
        MB="${MAJORS_BACK:-2}"
        if [ -z "$MB" ]; then MB=2; fi
        echo "Discovering released BC versions (newest $MB majors)..."
        MATRIX=$(python3 scripts/discover-bc-versions.py --mode released --majors-back "$MB")
        echo "Required matrix: $MATRIX"

        if [ "$INCLUDE_PREVIEW" = "true" ]; then
          echo "Discovering insider preview versions..."
          # A wobble on the insider index must not take the required matrix
          # down with it — preview is a bonus, not a gate.
          if P=$(python3 scripts/discover-bc-versions.py --mode preview --majors-back "$MB"); then
            COUNT=$(P="$P" python3 -c "import os,json; print(len(json.loads(os.environ['P'])['include']))")
            PREVIEW="$P"
            if [ "$COUNT" -gt 0 ]; then HAS_PREVIEW=true; fi
            echo "Preview matrix ($COUNT legs): $PREVIEW"
          else
            echo "::warning::insider preview discovery failed — skipping preview legs"
          fi
        fi

        {
          echo "matrix=$MATRIX"
          echo "preview_matrix=$PREVIEW"
          echo "has_preview=$HAS_PREVIEW"
        } >> "$GITHUB_OUTPUT"

    - id: alcops
      # Resolve the latest ALCops.Analyzers nupkg URL via the GitHub API.
      # ALCops bakes the version into the asset filename, so the static
      # /releases/latest/download/<file> redirect doesn't work for them
      # — we have to read the release JSON. This intentionally pulls
      # 'latest' on every run so the matrix catches any regression
      # introduced by an ALCops release that breaks Linux .NET 8 loading.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        URL=$(gh api repos/ALCops/Analyzers/releases/latest \
          --jq '.assets[] | select(.name | endswith(".nupkg")) | .browser_download_url' \
          | head -1)
        if [ -z "$URL" ]; then
          echo "ERROR: could not resolve latest ALCops nupkg URL" >&2
          exit 1
        fi
        echo "Resolved latest ALCops: $URL"
        echo "url=$URL" >> $GITHUB_OUTPUT

  build-image:
    # Build the bc-runner image from THIS commit AND run the matrix against
    # it, by pushing a throwaway `ci-<sha>` tag.
    #
    # This job used to build with `push: false` and then hand the matrix
    # `:latest` — i.e. it verified that the current commit still *builds*,
    # then tested a completely different image. Any change to src/Dockerfile
    # (or anything else baked into the image) was therefore untestable on a
    # branch: the build succeeded, the tests ran against whatever master last
    # published, and the run went green while proving nothing about the diff.
    #
    # It bit for real on `net10-integration`. That branch adds the .NET 10
    # runtime to the image so BC 29 can start; the preview leg still failed
    # with "You must install or update .NET ... 10.0.0 ... The following
    # frameworks were found: 8.0.29", because it booted master's .NET 8
    # `:latest`. The summary's "known-expected failure: BC 29 targets .NET 10
    # while the image ships .NET 8" note made that read as nothing new.
    #
    # `ci-<sha>` deliberately is NOT `:latest` and NOT the bare `:<sha>` that
    # build-image.yml publishes from master — this workflow must never move
    # the tags consumers pull, and a `ci-` prefix keeps untested branch builds
    # visibly distinct from published ones. They accumulate in GHCR; the
    # prefix is what makes them safe to prune in bulk if that ever matters.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      runner_image: ${{ steps.select-image.outputs.runner_image }}
    steps:
    - uses: actions/checkout@v4

    - name: Set lowercase image name
      run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bc-runner" >> $GITHUB_ENV

    # A pull_request from a fork gets a read-only GITHUB_TOKEN, so it cannot
    # push to GHCR at all. Those runs keep the old behaviour (build as a
    # compile check, test against `:latest`) rather than failing outright —
    # but they say so, because that combination cannot validate an image
    # change and a green run must not be mistaken for one that did.
    - id: can-push
      name: Decide whether this run can push an image
      run: |
        if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
          echo "value=false" >> "$GITHUB_OUTPUT"
        else
          echo "value=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Log in to GHCR
      if: steps.can-push.outputs.value == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build BC runner image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Dockerfile
        push: ${{ steps.can-push.outputs.value == 'true' }}
        tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
        # Stays on the GHA cache rather than the registry `:cache` tag that
        # build-image.yml uses: this job also has to work on fork PRs, which
        # have no registry write access at all.
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - id: select-image
      name: Select runner image reference
      run: |
        if [ "${{ steps.can-push.outputs.value }}" = "true" ]; then
          REF="${{ env.IMAGE }}:ci-${{ github.sha }}"
          echo "Testing the image built from this commit: $REF"
        else
          REF="${{ env.IMAGE }}:latest"
          echo "::warning::Fork PR: GITHUB_TOKEN cannot push to GHCR, so the"
          echo "::warning::matrix runs against the published $REF, NOT the image"
          echo "::warning::built from this commit. Image changes in this PR are"
          echo "::warning::compile-checked only — re-run from a branch in this"
          echo "::warning::repository to actually test them."
        fi
        echo "runner_image=$REF" >> "$GITHUB_OUTPUT"

  # ─── Matrix test: each BC version runs through the canonical reusable
  #     workflow with the smoke test extension. The reusable workflow
  #     handles BC startup parallelism, AL compile, publish (with
  #     422-body-checking), test execution, and TESTS_TOTAL > 0 guard.
  test:
    needs: [prepare, build-image]
    name: BC ${{ matrix.bc_version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/bc-test-from-source.yml
    with:
      bc_version: ${{ matrix.bc_version }}
      bc_country: w1
      bc_type: sandbox
      # No sql_image override: the matrix deliberately runs whatever
      # docker-compose.yml defaults to, so this stays a gate on what
      # consumers actually get rather than on a parallel configuration.
      test_app_dirs: extensions/smoke-test
      # The smoke-test fixture ships a placeholder runtime ("14.0") so one
      # committed app.json spans the whole version matrix; "auto" opts into
      # the per-leg rewrite (27 → 16.0, 28 → 17.0). Consumer repos should
      # NOT set this — the workflow respects their declared runtime.
      runtime_version: auto
      # Pipe form deliberately exercises the multi-range parser end-to-end on
      # the hosted runner so a regression in run-tests.sh's normalization shows
      # up here. Equivalent to the legacy "70000..70001" but covers the new
      # code path. See scripts/run-tests.sh CODEUNIT_RANGE handling.
      codeunit_range: "70000|70001"
      # test_runner is left at its default ("auto"): each leg probes the
      # live server's dev endpoint and uses `al runtests` (the AL dotnet
      # tool's native runner driving the NST's /dev/TestRunnerHub) when
      # Dev API 7.0+ is advertised — BC 28.0+ — falling back to the
      # OData+WebSocket runner on older versions. See
      # scripts/run-tests-altool.py for the altool path's limitations
      # (no AL test runner codeunit, prerelease-only CLI, etc.).
      # Use the selected repository tag from build-image (latest) because
      # test-versions does not publish images.
      runner_image: ${{ needs.build-image.outputs.runner_image }}
      # Pin the bc-linux scripts checkout to this commit too, so a test
      # at SHA X uses entrypoint.sh / run-tests.sh / publish-app.sh /
      # wait-for-bc-healthy.sh from SHA X. Without this we'd test the
      # SHA X image with master scripts.
      bc_linux_ref: ${{ github.sha }}
      # ─── Analyzer load validation ───────────────────────────────────────
      # Every matrix leg compiles the smoke test with all four Microsoft cops
      # PLUS the latest ALCops nupkg PLUS a JSON ruleset that includes
      # StefanMaron/RulesetFiles/base.rulset.json as a remote include. The
      # reusable workflow's compile step greps the AL compiler output for
      # AD0001 / "Could not load" / BadImageFormatException /
      # PlatformNotSupportedException and fails the job if any of those
      # appear — catches "cop DLL silently failed to load on a new BC
      # version" regressions immediately, across the whole support matrix.
      # extensions/smoke-test/cops.rulset.json is bc-linux-internal and
      # NOT shipped to consumers via the template — they bring their own
      # ruleset and customCodeCops via the workflow inputs.
      enable_code_cop: true
      enable_ui_cop: true
      enable_app_source_cop: true
      enable_per_tenant_extension_cop: true
      custom_code_cops: ${{ needs.prepare.outputs.alcops_url }}
      ruleset_file: "extensions/smoke-test/cops.rulset.json"
      enable_external_rulesets: true
      # Exercise preprocessor_symbols end-to-end on every matrix leg.
      # The smoke test has no #if guards so the symbol is a no-op at the AL
      # level, but it exercises the flag wiring through the workflow and alc.
      preprocessor_symbols: "SMOKE"
      # Exercise the compiled-apps artifact upload end-to-end on every
      # matrix leg. Suffix must be unique per upload within the run (same
      # constraint as the junit artifact name above) — bc_version already
      # varies per leg, so reuse it.
      artifact_name_suffix: "${{ matrix.bc_version }}-required"
      # verify_authentication defaults to false for consumers (see the
      # reusable workflow's input doc) — but bc-linux's own matrix is
      # exactly the regression gate that check exists for, so opt in here
      # on every supported version.
      verify_authentication: true

  # ─── Preview matrix: NON-BLOCKING insider legs ──────────────────────────
  #     The next BC major and the next minor, discovered from Microsoft's
  #     INSIDER index (anonymously readable, no SAS token — same path shape
  #     as the public one). These run the identical smoke test through the
  #     identical reusable workflow, but their failure MUST NOT turn this
  #     workflow red: they are an early-warning signal about a BC version
  #     nobody supports yet, not a gate on bc-linux.
  #
  #     Expect the next-major leg to FAIL today: BC 29 targets .NET 10 and
  #     the bc-runner image ships the .NET 8 runtime, so the NST cannot even
  #     start. That is the news the leg exists to deliver — when it turns
  #     green, .NET 10 support has landed.
  #
  #     Non-blocking is implemented via the reusable workflow's
  #     `continue_on_error` input, NOT via `continue-on-error:` here:
  #     GitHub does not allow that key on a job that `uses:` a reusable
  #     workflow, so it has to be set on the job inside the callee.
  test-preview:
    needs: [prepare, build-image]
    if: needs.prepare.outputs.has_preview == 'true'
    name: "BC ${{ matrix.label }} — preview, non-blocking"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.preview_matrix) }}
    uses: ./.github/workflows/bc-test-from-source.yml
    with:
      # Full version (e.g. "29.0.53450.0"), not a short one: insider builds
      # move daily, and the artifact_url below already pins an exact build.
      # Keeping the two in sync makes a preview failure reproducible, and
      # keeps the JUnit artifact name unique against the required matrix.
      bc_version: ${{ matrix.bc_version }}
      bc_artifact_url: ${{ matrix.artifact_url }}
      bc_country: w1
      bc_type: sandbox
      continue_on_error: true
      # A preview version that cannot boot would otherwise sit in the default
      # 30-minute health wait on every run. BC reaches healthy in 1-2 min in
      # CI, so 8 is generous while capping the waste on a leg we expect to
      # fail. Required legs keep the 30-minute default.
      health_timeout_minutes: 8
      test_app_dirs: extensions/smoke-test
      runtime_version: auto
      codeunit_range: "70000|70001"
      runner_image: ${{ needs.build-image.outputs.runner_image }}
      bc_linux_ref: ${{ github.sha }}
      # Same analyzer wiring as the required matrix — a new BC major is
      # exactly where a cop DLL stops loading, and the compile step runs on
      # the runner whether or not the NST manages to boot.
      enable_code_cop: true
      enable_ui_cop: true
      enable_app_source_cop: true
      enable_per_tenant_extension_cop: true
      custom_code_cops: ${{ needs.prepare.outputs.alcops_url }}
      ruleset_file: "extensions/smoke-test/cops.rulset.json"
      enable_external_rulesets: true
      preprocessor_symbols: "SMOKE"
      # Same reasoning as the required matrix: preview legs are the
      # earliest place a wire-format regression on a new BC version would
      # show up.
      verify_authentication: true

  # Puts the "this was expected" framing in the run summary, so a red-ish
  # preview leg in the job list doesn't read as a regression to whoever
  # opens the run next.
  preview-note:
    needs: [prepare, test-preview]
    if: always() && needs.prepare.outputs.has_preview == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Explain the preview legs
      env:
        PREVIEW: ${{ needs.prepare.outputs.preview_matrix }}
        RESULT: ${{ needs.test-preview.result }}
      run: |
        {
          echo "## Preview (insider) legs — non-blocking"
          echo
          echo "Result: \`$RESULT\`"
          echo
          echo "These legs test BC builds from Microsoft's **insider** index"
          echo "(next major + next minor). They do **not** gate this workflow."
          echo "A failure here means an unreleased BC build does not run on"
          echo "bc-linux yet — early warning, not a regression."
          echo
          echo "Known-expected failure: the next-major leg targets .NET 10"
          echo "while the bc-runner image ships .NET 8, so the NST cannot start."
          echo
          echo '```json'
          echo "$PREVIEW"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # Exercises the container's own artifact download path (no pre-cached
  # artifacts). Verifies the in-container download feature and lets us
  # measure download speed directly. Runs once (BC 27.5) in parallel
  # with the main matrix. Doesn't fit the reusable workflow pattern
  # because the reusable workflow always pre-downloads artifacts on
  # the host.
  test-container-download:
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Container download test (BC 28.1)

    steps:
    - uses: actions/checkout@v4

    - name: Set lowercase image name
      run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bc-runner" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Start BC (in-container artifact download)
      # BC_ARTIFACTS_DIR is intentionally NOT set so docker-compose uses a named
      # volume (bc-artifacts) which starts empty — forcing the entrypoint to
      # download artifacts itself. This validates the container download feature.
      env:
        BC_VERSION: "28.1"
        BC_RUNNER_IMAGE: ${{ needs.build-image.outputs.runner_image }}
      run: |
        STEP_START=$(date +%s)
        docker compose up -d 2>&1 | tail -10
        # Use the shared healthcheck script. 30-min budget covers the
        # in-container artifact download (~3 min) + BC boot (~3-5 min).
        ./scripts/wait-for-bc-healthy.sh 30
        echo "TOTAL_DURATION=$(($(date +%s) - STEP_START))" >> $GITHUB_ENV

    - name: Download timing summary
      if: always()
      run: |
        echo "=== In-container artifact download timing ==="
        docker compose logs bc 2>&1 | grep "\[artifacts\]"
        echo ""
        echo "Total start time (download + DB restore + BC startup): ${TOTAL_DURATION:-n/a}s"

  # Exercises the macOS compose overlay (docker-compose.macos.yml) on a
  # Linux runner. GitHub-hosted macOS runners cannot run containers at
  # all — Apple's Virtualization framework forbids nested virtualization
  # on the M1/M2 hardware GitHub uses — so the podman/Rosetta side of
  # MacOS.md is untestable in hosted CI. This leg verifies everything
  # else the overlay changes: the 2022-CU17 image tag still exists on
  # MCR, SQL Server boots and restores the demo DB while running as
  # root (user 0:0), and BC comes up healthy on top of that SQL.
  # COMPOSE_FILE makes every docker compose invocation (including the
  # shared wait-for-bc-healthy.sh) apply the overlay consistently.
  test-macos-overlay:
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: macOS overlay test (BC 28.1)
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.macos.yml

    steps:
    - uses: actions/checkout@v4

    - name: Set lowercase image name
      run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bc-runner" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate compose files merge
      run: |
        # Catches YAML/merge errors in the overlay without booting anything,
        # and proves the overlay actually overrides what it claims to.
        MERGED=$(docker compose config)
        echo "$MERGED" | grep -q "mssql/server:2022-CU17-ubuntu-22.04" \
          || { echo "ERROR: overlay did not apply the CU17 SQL image pin"; exit 1; }
        echo "$MERGED" | grep -q 'user: "0:0"' \
          || { echo "ERROR: overlay did not apply user 0:0 on the sql service"; exit 1; }

    - name: Start BC with macOS overlay
      env:
        BC_VERSION: "28.1"
        BC_RUNNER_IMAGE: ${{ needs.build-image.outputs.runner_image }}
      run: |
        docker compose up -d 2>&1 | tail -10
        ./scripts/wait-for-bc-healthy.sh 30

    - name: Verify overlay applied to running stack
      run: |
        SQL_CID=$(docker compose ps -q sql)
        SQL_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$SQL_CID")
        SQL_UID=$(docker compose exec -T sql id -u)
        echo "sql image: $SQL_IMAGE, uid: $SQL_UID"
        [ "$SQL_IMAGE" = "mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04" ] \
          || { echo "ERROR: sql container is not running the CU17 image"; exit 1; }
        [ "$SQL_UID" = "0" ] \
          || { echo "ERROR: sql container is not running as root"; exit 1; }

    - name: SQL log excerpt
      if: failure()
      run: docker compose logs sql 2>&1 | tail -50

