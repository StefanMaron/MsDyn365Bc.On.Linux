name: BC tests on Linux (compile from source)

# Plug-and-play GitHub Actions workflow for running AL tests against a
# Business Central NST running on Linux. This template COMPILES your AL
# source (app + test apps) inside the runner and then publishes the
# compiled .app files to BC and runs the tests.
#
# Powered by StefanMaron/MsDyn365Bc.On.Linux — runs unmodified Microsoft BC on Linux
# via runtime patching of the Windows .NET service tier. Image:
# ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest
#
# ──────────────────────────────────────────────────────────────────────
# HOW TO USE
# ──────────────────────────────────────────────────────────────────────
# 1. Copy this file into your repo at .github/workflows/bc-test.yml
# 2. Edit the values under "env:" below to match your repo layout:
#      - BC_VERSION / BC_COUNTRY      → which BC version to test against
#      - APP_DIRS                     → directories containing app.json
#                                       for your production app(s).
#                                       Space-separated, leave empty if
#                                       you only have test apps.
#      - TEST_APP_DIRS                → directories containing app.json
#                                       for your test app(s)
#      - CODEUNIT_RANGE               → ID range of your TEST codeunits to
#                                       execute (e.g. "70000..70099").
#                                       Production codeunits aren't run,
#                                       only published.
# 3. Commit + push. The workflow runs on every PR and push to main.
#
# Anything more advanced (matrix over BC versions, secrets, custom
# symbol cache) — duplicate the job and tweak from there. The bc-linux
# repo's own .github/workflows/test-versions.yml is a worked example.
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # ----- Edit these for your project ----------------------------------
  BC_VERSION: "27.5"
  BC_COUNTRY: "w1"
  BC_TYPE: "sandbox"

  # Space-separated paths to your production AL app source dirs (each
  # must contain an app.json). Leave empty ("") if your repo only has
  # test apps.
  APP_DIRS: "app"

  # Space-separated paths to your AL test app source dirs.
  TEST_APP_DIRS: "test"

  # IDs of your TEST codeunits to execute. Pick a range that covers all
  # test codeunits in TEST_APP_DIRS — production codeunits in APP_DIRS
  # are published but not run.
  #
  # Accepted formats:
  #   "50000..99999"                       single AL range
  #   "50000..50100|130450..130459"        multiple ranges (pipe-separated)
  #   "50000,50001,50002"                  explicit ids
  #   "50000..50100,130450,200000..210000" mixed
  CODEUNIT_RANGE: "50000..99999"

  # AL compiler tool version. Leave blank to auto-derive from BC_VERSION
  # (recommended): BC 27.x → 16.2.28.57946, BC 28.x → 17.0.34.45391.
  # Set explicitly to pin a specific version.
  AL_TOOL_VERSION: ""

  # AL runtime version written into all app.json files before compile.
  # Auto-derived from BC_VERSION when blank: BC 27 → 16.0, BC 28 → 17.0.
  RUNTIME_VERSION: ""

  # Comma-separated preprocessor symbols passed to /define.
  # Example: "BC27PLUS,BC28PLUS" for a version-gated matrix leg.
  PREPROCESSOR_SYMBOLS: ""

  # ─── Optional: analyzers + ruleset ───────────────────────────────────
  # All off by default. Set to "true" / fill in to enable. The compile
  # step fails the workflow if any cop DLL fails to load (AD0001,
  # "Could not load", BadImageFormatException, PlatformNotSupportedException),
  # so a misconfigured cop can never produce a silently green build.
  # See ANALYZER-SUPPORT-PLAN.md in the bc-linux repo for the gotchas.
  ENABLE_CODE_COP: "false"
  ENABLE_UI_COP: "false"
  ENABLE_APP_SOURCE_COP: "false"
  ENABLE_PER_TENANT_EXTENSION_COP: "false"
  # Comma- or newline-separated list of additional cop DLLs. Each entry
  # is either a local path or an https:// URL. .nupkg URLs are unzipped
  # and every DLL under lib/net8.0/ is added — pointing at the ALCops
  # release nupkg makes all 7 cops + ALCops.Common.dll come along
  # automatically. Example:
  #   "https://github.com/ALCops/Analyzers/releases/download/v0.6.1/ALCops.Analyzers.0.6.1.nupkg"
  CUSTOM_CODE_COPS: ""
  # JSON ruleset (NOT the classic VS XML .ruleset format). Local path
  # or https:// URL.
  RULESET_FILE: ""
  # Set to "true" if RULESET_FILE has includedRuleSets[].path entries
  # pointing at https:// URLs (e.g. shared org-wide rulesets in a public
  # repo). Required by the AL compiler for any URL-scheme include.
  ENABLE_EXTERNAL_RULESETS: "false"
  # Mirror AL-Go's default: analyzers don't run on test apps. Set to
  # "true" to enforce cops on test apps too.
  ENABLE_CODE_ANALYZERS_ON_TEST_APPS: "false"
  # --------------------------------------------------------------------

  # bc-linux runtime image (publicly available on GHCR).
  BC_RUNNER_IMAGE: "ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest"

  # Where the extracted BC artifacts are kept. Empty = <workspace>/artifact-cache,
  # which is correct for a GitHub-hosted runner: the VM is fresh every job, so
  # the directory is always empty and the download happens exactly as it always
  # did.
  #
  # On a SELF-HOSTED runner, point this at a path OUTSIDE the workspace
  # (e.g. /var/cache/bc-artifacts) and the ~2 GB download is skipped entirely
  # whenever that directory already holds the same resolved build. Concurrent
  # jobs are safe — download-artifacts.sh locks the directory, so the second
  # job waits and then hits the cache the first one wrote. Budget ~3.1 GB per
  # BC version kept.
  #
  # This is NOT actions/cache: nothing is uploaded or downloaded through
  # GitHub's cache service, it is just a directory that happens to survive.
  ARTIFACT_CACHE_DIR: ""

jobs:
  test:
    # Change this to your self-hosted label to get the warm-filesystem paths:
    # the artifact cache above, plus the patched service-tier and compiled-
    # assembly volumes, which the entrypoint stamps and reuses on its own with
    # nothing to configure here. Note that a label naming an offline runner
    # QUEUES rather than falling back to hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ─── Phase 1: cheap parallel-friendly checkouts ──────────────────
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: project

      # bc-linux ships docker-compose.yml, run-tests.sh, the bundled
      # TestRunnerExtension.app, and download-artifacts.sh.
      - name: Checkout bc-linux runtime
        uses: actions/checkout@v4
        with:
          repository: StefanMaron/MsDyn365Bc.On.Linux
          ref: master
          path: bc-linux

      - name: Initialize timing
        run: bash bc-linux/scripts/workflow-summary.sh init

      # ─── Phase 2: artifact download + docker image pull (parallel) ───
      - name: Download BC artifacts + pull docker images (parallel)
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin DOWNLOAD "Download BC artifacts + pull docker images"
          # Resolved once, here, and exported for every later step AND for
          # docker-compose's bind mount. They must not disagree: if the
          # container mounts a different path than the one that was downloaded
          # into, it sees an empty directory and re-downloads 2 GB inside the
          # container instead of using the warm cache.
          : "${ARTIFACT_CACHE_DIR:=$GITHUB_WORKSPACE/artifact-cache}"
          BC_ARTIFACTS_DIR="$ARTIFACT_CACHE_DIR/$BC_VERSION"
          echo "BC_ARTIFACTS_DIR=$BC_ARTIFACTS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$BC_ARTIFACTS_DIR"
          (
            bc-linux/scripts/download-artifacts.sh \
              "$BC_TYPE" "$BC_VERSION" "$BC_COUNTRY" \
              "$BC_ARTIFACTS_DIR"
          ) &
          ARTIFACT_PID=$!
          (
            cd bc-linux
            # compose-pull.sh retries transient registry failures (mcr
            # occasionally WAF-blocks runner IPs) but aborts immediately
            # on a permanent one. The inline loop it replaced slept 15s x5
            # on "manifest unknown", turning a wrong or not-yet-published
            # tag into 60s of silent dead time.
            bash scripts/compose-pull.sh
          ) &
          PULL_PID=$!
          wait $ARTIFACT_PID || { echo "artifact download failed"; exit 1; }
          wait $PULL_PID     || { echo "docker pull failed"; exit 1; }
          bash bc-linux/scripts/workflow-summary.sh end DOWNLOAD

      # ─── Phase 3: figure out the BC_KEEP_APP_IDS for the entrypoint ──
      - name: Resolve apps to keep in BC database
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin RESOLVE "Resolve apps to keep"
          # Walk consumer app.json files, keep the 5-app baseline + any
          # non-test-framework transitive deps. Test framework is excluded
          # — the entrypoint's republish step does a fresh install.
          # Seed the closure with bc-linux's own TestRunnerExtension app.json.
          # It declares a dependency on Microsoft's Test Runner, which most
          # consumer test apps do NOT declare — they depend on Library Assert
          # and Tests-TestLibraries instead. Without this seed Test Runner
          # falls outside the closure, the selective filter wipes it in SQL,
          # and the entrypoint's TestRunnerExtension publish then fails with
          # AL1024. Seeding via app.json rather than a hardcoded GUID list
          # keeps the closure self-maintaining.
          ARGS="--app-json bc-linux/extensions/TestRunnerExtension/app.json"
          for d in $APP_DIRS $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            [ -f "project/$d/app.json" ] && ARGS="$ARGS --app-json project/$d/app.json"
          done
          KEEP_IDS=$(python3 bc-linux/scripts/resolve-keep-app-ids.py \
            $ARGS \
            --artifact-dir "$BC_ARTIFACTS_DIR")
          echo "Resolved keep set: $KEEP_IDS"
          echo "BC_CLEAR_ALL_APPS=selective" >> "$GITHUB_ENV"
          echo "BC_KEEP_APP_IDS=$KEEP_IDS" >> "$GITHUB_ENV"
          bash bc-linux/scripts/workflow-summary.sh end RESOLVE

      # ─── Optional: stage an ISV/developer license ────────────────────
      # Without this step BC boots with the public Cronus license. To use
      # your own license, store it base64-encoded as a repo secret named
      # BC_LICENSE:
      #   base64 -w0 < your-license.bclicense | gh secret set BC_LICENSE
      # then uncomment the `if:` line below. The entrypoint imports the
      # license BEFORE NST starts, so no boot/import/restart cycle is
      # needed. Without the secret set, this step is a no-op.
      # Step always runs; the body skips itself when the secret is unset.
      # We can NOT use `if: secrets.BC_LICENSE != ''` — the `secrets`
      # context isn't allowed in step `if:` expressions (rejected by
      # GitHub at parse time, verified with actionlint).
      - name: Stage ISV license (if provided)
        env:
          BC_LICENSE_B64: ${{ secrets.BC_LICENSE }}
        run: |
          set -e
          if [ -z "${BC_LICENSE_B64:-}" ]; then
            echo "BC_LICENSE secret not set; using default Cronus license"
            exit 0
          fi
          LICENSE_PATH="$RUNNER_TEMP/bc-license.bclicense"
          printf '%s' "$BC_LICENSE_B64" | base64 -d > "$LICENSE_PATH"
          [ -s "$LICENSE_PATH" ] || { echo "ERROR: BC_LICENSE secret decoded to an empty file"; exit 1; }
          chmod 644 "$LICENSE_PATH"
          echo "BC_LICENSE_HOST_PATH=$LICENSE_PATH" >> "$GITHUB_ENV"
          echo "BC_LICENSE_FILE=/bc/custom-license.bclicense" >> "$GITHUB_ENV"

      # ─── Phase 3.9: claim the container stack ────────────────────────
      # Compose names its project after the working directory's basename —
      # `bc-linux` here and in every other pipeline — and docker-compose.yml
      # binds fixed host ports. Two jobs on one docker host therefore drive the
      # SAME containers, and the second one's `docker compose down` below
      # deletes the first one's BC mid-test (issue #24). ci-lock.sh serializes
      # them on a machine-wide lease.
      #
      # On ubuntu-latest this is a no-op — the VM belongs to this job. It
      # earns its place the moment you point `runs-on` at a self-hosted
      # runner, which is also when the artifact cache and the warm service-tier
      # volume start paying off. Use the reusable workflow
      # (bc-test-from-source.yml) if you want more than one BC per machine; it
      # exposes an `instance_slot` input that moves the project name and every
      # port so jobs run concurrently instead of queueing.
      - name: Reserve the BC container stack on this machine
        run: bash bc-linux/scripts/ci-lock.sh acquire bc-linux --wait-minutes 35 --max-hold-minutes 45

      # ─── Phase 4: kick off BC startup in the background ──────────────
      - name: Start BC on Linux (background)
        working-directory: bc-linux
        run: |
          bash scripts/workflow-summary.sh begin BC_BOOT "BC startup (background → wait for healthy)"
          # Clear any leftover compose state before starting. On a GitHub-hosted
          # runner this is a no-op (fresh VM, nothing to remove). On a self-hosted
          # one the previous job's bc/sql containers may still be running, and
          # `docker compose up -d` adopts a running container instead of recreating
          # it — the healthcheck then goes green in seconds against the PREVIOUS
          # run's database and published apps, which looks like a very fast pass.
          # Named volumes are kept on purpose: the entrypoint stamps /bc/service
          # and reuses it only when it matches this platform + image, so the warm
          # path stays warm without going stale.
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d
          echo "BC container started in background — continuing with other work."

      # ─── Phase 5: work that runs DURING BC's startup window ──────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install AL compiler (Linux)
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin AL_INSTALL "Install AL compiler"
          TOOL="$AL_TOOL_VERSION"
          BC_MAJOR=$(echo "$BC_VERSION" | cut -d. -f1)
          # A policy keyword ("matching" default, "latest", "prerelease")
          # resolves through the shared script; anything else is an exact
          # version and is used as-is. "latest" is the answer when an app
          # declares a runtime its own major's compiler rejects — e.g.
          # runtime 16.1 is refused by AL 16.2 but accepted by AL 17.
          case "$TOOL" in
            ""|matching|latest|prerelease)
              AL_POLICY="${TOOL:-matching}"
              TOOL=""
              ;;
            *)
              AL_POLICY=""
              ;;
          esac
          if [ -z "$TOOL" ]; then
            # Resolved from nuget.org: AL major is BC major - 11, newest
            # stable of that major, falling back to the newest prerelease when
            # no stable exists (a BC version still in preview has no stable
            # compiler). Calling the shared script rather than keeping a table
            # here means a new BC release needs no edit to this file.
            if ! TOOL=$(python3 bc-linux/scripts/resolve-al-tool-version.py "$BC_VERSION" --policy "$AL_POLICY"); then
              echo "Could not resolve an AL compiler version for BC $BC_VERSION" >&2
              exit 1
            fi
          fi
          echo "Installing AL compiler $TOOL"
          PKG="microsoft.dynamics.businesscentral.development.tools.linux"
          AL_TOOL_DIR=""

          # Try dotnet global tool first (BC 27 / v16 packages ship with
          # DotnetToolSettings.xml and install correctly this way).
          # BC 28+ dropped the tool manifest — the package is now a plain
          # library nupkg and `dotnet tool install` rejects it; fall through
          # to the nupkg-extraction path in that case. Do NOT swallow the
          # rejection with `|| true`: without the fallback below there is no
          # `AL` command at all and the compile step dies with exit 127.
          if dotnet tool install -g \
              Microsoft.Dynamics.BusinessCentral.Development.Tools.Linux \
              --version "$TOOL" 2>&1 \
          || dotnet tool update -g \
              Microsoft.Dynamics.BusinessCentral.Development.Tools.Linux \
              --version "$TOOL" 2>&1; then
            echo "Installed as dotnet global tool"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
            # Locate alc by searching, not by assuming a TFM directory.
            AL_TOOL_DIR=$(dirname "$(find "$HOME/.dotnet/tools/.store/$PKG" \
              -type f -name alc 2>/dev/null | sort | tail -1)")
          else
            # Not a dotnet tool — download and extract the nupkg directly.
            echo "Package is not a dotnet global tool; extracting nupkg"
            EXTRACT_DIR="$HOME/.al-tool-cache/$TOOL"
            mkdir -p "$EXTRACT_DIR"
            curl -fsSL \
              "https://api.nuget.org/v3-flatcontainer/${PKG}/${TOOL}/${PKG}.${TOOL}.nupkg" \
              -o "$EXTRACT_DIR/pkg.zip"
            unzip -q -o "$EXTRACT_DIR/pkg.zip" -d "$EXTRACT_DIR"
            rm "$EXTRACT_DIR/pkg.zip"
            # Find alc wherever the package puts it. The TFM directory is NOT
            # stable across AL majors: v17 ships lib/net8.0/alc, v18 ships
            # lib/net10.0/alc plus a lib/net8.0 holding only analyzer DLLs —
            # so a directory test on net8.0 finds the wrong place and
            # succeeds. Hardcoding it made the BC 29 leg fail with exit 127.
            # No runtime install is needed: alc is self-contained (its
            # runtimeconfig declares includedFrameworks), verified for v17
            # and v18.
            ALC_PATH=$(find "$EXTRACT_DIR" -type f -name alc 2>/dev/null | sort | tail -1)
            if [ -z "$ALC_PATH" ]; then
              echo "No 'alc' binary found in $PKG $TOOL" >&2
              find "$EXTRACT_DIR" -maxdepth 3 -type d | sed 's/^/  /' >&2
              exit 1
            fi
            AL_TOOL_DIR=$(dirname "$ALC_PATH")
            echo "Found alc at $ALC_PATH"
            chmod +x "$ALC_PATH" 2>/dev/null || true
            # Create an AL wrapper so `AL compile ...` works in later steps.
            # The v16 dotnet tool ships AL.dll which routes the `compile`
            # subcommand; raw alc doesn't accept it — strip it here.
            mkdir -p "$HOME/.al-bin"
            printf '#!/bin/bash\n[ "$1" = compile ] && shift\nexec "%s/alc" "$@"\n' \
              "$AL_TOOL_DIR" > "$HOME/.al-bin/AL"
            chmod +x "$HOME/.al-bin/AL"
            echo "$HOME/.al-bin" >> "$GITHUB_PATH"
          fi

          # Exported so the compile step can point resolve-analyzers.py at
          # the Microsoft cop DLLs — its auto-detection only knows the
          # dotnet-tool layout, not the extracted-nupkg one.
          echo "AL_TOOL_DIR=$AL_TOOL_DIR" >> "$GITHUB_ENV"
          echo "AL compiler ready: $AL_TOOL_DIR"
          bash bc-linux/scripts/workflow-summary.sh end AL_INSTALL

      - name: Stage symbols from BC artifacts
        run: |
          bash bc-linux/scripts/workflow-summary.sh begin SYMBOLS "Stage symbols"
          mkdir -p symbols
          # Manifest-driven resolver: walks the artifact tree, indexes
          # every .app by its declared id, then stages exactly the
          # transitive dependency closure of the consumer's app.json
          # files (plus System.app, which AL compile always needs).
          # Robust to Microsoft moving apps between folders across BC
          # versions — the old glob-based staging silently failed
          # whenever an expected app moved (e.g. Tests-TestLibraries
          # under platform/applications/BaseApp/Test/ in BC 27.5).
          ARGS=""
          for d in $APP_DIRS $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            [ -f "project/$d/app.json" ] && ARGS="$ARGS --app-json project/$d/app.json"
          done
          python3 bc-linux/scripts/stage-symbols.py \
            $ARGS \
            --artifact-dir "$BC_ARTIFACTS_DIR" \
            --out-dir symbols \
            || true   # warnings about unresolved deps are non-fatal; AL compile gives the precise error if any
          echo "Staged $(ls symbols/*.app 2>/dev/null | wc -l) symbol files"
          bash bc-linux/scripts/workflow-summary.sh end SYMBOLS

      - name: Patch app.json runtime
        run: |
          EFFECTIVE_RUNTIME="$RUNTIME_VERSION"
          BC_MAJOR=$(echo "$BC_VERSION" | cut -d. -f1)
          if [ -z "$EFFECTIVE_RUNTIME" ]; then
            # Same BC-major-minus-11 rule as the compiler version.
            if ! EFFECTIVE_RUNTIME=$(python3 bc-linux/scripts/resolve-al-tool-version.py "$BC_VERSION" --runtime); then
              echo "Could not resolve an AL runtime version for BC $BC_VERSION" >&2
              exit 1
            fi
          fi
          echo "Patching app.json runtime → $EFFECTIVE_RUNTIME"
          for d in $APP_DIRS $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            F="project/$d/app.json"
            [ -f "$F" ] || continue
            python3 - "$F" "$EFFECTIVE_RUNTIME" <<'PYEOF'
          import sys, json, pathlib
          p = pathlib.Path(sys.argv[1])
          d = json.loads(p.read_text())
          if d.get("runtime") != sys.argv[2]:
              d["runtime"] = sys.argv[2]
              p.write_text(json.dumps(d, indent=2) + "\n")
              print(f"  patched {p}: runtime → {sys.argv[2]}")
          else:
              print(f"  {p}: runtime already {sys.argv[2]}, skip")
          PYEOF
          done

      - name: Compile AL apps (no publish yet)
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin COMPILE "Compile AL apps"

          # ─── Resolve analyzer flags via the helper ─────────────────
          # Build the helper invocation only when SOMETHING is configured.
          # When nothing is set, ANALYZER_FLAGS stays empty and the
          # compile commands run exactly as they did before this feature
          # existed. resolve-analyzers.py handles: Microsoft cop path
          # resolution from the AL tool dir, downloading URL-referenced
          # custom cops, .nupkg auto-extraction (so ALCops.Common.dll
          # comes along automatically), and remote ruleset downloads.
          HELPER_ARGS=()
          [ "$ENABLE_CODE_COP" = "true" ] && HELPER_ARGS+=(--enable-code-cop)
          [ "$ENABLE_UI_COP" = "true" ] && HELPER_ARGS+=(--enable-ui-cop)
          [ "$ENABLE_APP_SOURCE_COP" = "true" ] && HELPER_ARGS+=(--enable-app-source-cop)
          [ "$ENABLE_PER_TENANT_EXTENSION_COP" = "true" ] && HELPER_ARGS+=(--enable-per-tenant-extension-cop)
          [ -n "$CUSTOM_CODE_COPS" ] && HELPER_ARGS+=(--custom-code-cops "$CUSTOM_CODE_COPS")
          [ -n "$RULESET_FILE" ] && HELPER_ARGS+=(--ruleset-file "$RULESET_FILE")
          [ "$ENABLE_EXTERNAL_RULESETS" = "true" ] && HELPER_ARGS+=(--enable-external-rulesets)

          # Run the helper to a tempfile rather than via process substitution.
          # `mapfile -t < <(python3 ...)` SILENTLY SWALLOWS the helper's exit
          # code, so if the helper bails on a missing path the workflow
          # silently compiles without analyzers and reports a green build.
          # The tempfile pattern lets `if ! ...` see the real exit code.
          # --project-root project prepends the consumer checkout dir to
          # any local paths (URLs pass through).
          ANALYZER_FLAGS=()
          if [ ${#HELPER_ARGS[@]} -gt 0 ]; then
            HELPER_OUT=$(mktemp)
            # --al-tool-dir is where the Microsoft cop DLLs live. Pass it
            # explicitly: on BC 28+ the compiler comes from an extracted
            # nupkg, which the helper's auto-detection doesn't know about.
            if ! python3 bc-linux/scripts/resolve-analyzers.py \
                --project-root project \
                ${AL_TOOL_DIR:+--al-tool-dir "$AL_TOOL_DIR"} \
                "${HELPER_ARGS[@]}" > "$HELPER_OUT"; then
              echo "ERROR: resolve-analyzers.py failed — check stderr above" >&2
              rm -f "$HELPER_OUT"
              exit 1
            fi
            mapfile -t ANALYZER_FLAGS < "$HELPER_OUT"
            rm -f "$HELPER_OUT"
            echo "Analyzer flags: ${ANALYZER_FLAGS[*]}"
          fi

          # ─── Pattern that catches every analyzer load failure mode ──
          # AL compile reports these as WARNINGS (AD0001 specifically),
          # so without this guard a misconfigured cop would silently
          # disable itself and the workflow would report a green build
          # with no cops actually enforced. Failing here is the only
          # way you learn your cop wiring is broken.
          ANALYZER_LOAD_FAIL_PATTERN='AD0001|Could not load|BadImageFormatException|PlatformNotSupportedException'

          PP_FLAG=()
          [ -n "$PREPROCESSOR_SYMBOLS" ] && PP_FLAG=("/define:$PREPROCESSOR_SYMBOLS")

          compile_dir() {
            local src="$1"
            shift
            [ -f "$src/app.json" ] || { echo "skip $src (no app.json)" >&2; return 0; }
            mkdir -p "$src/.alpackages"
            cp symbols/*.app "$src/.alpackages/" 2>/dev/null || true
            local out
            out="$(pwd)/build/$(basename "$src").app"
            mkdir -p build
            echo ">>> Compiling $src → $out"
            # Remaining args ($@) are the analyzer flag fragments — may be empty.
            if [ "$#" -gt 0 ]; then
              local tmplog rc
              tmplog=$(mktemp)
              AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}" "$@" 2>&1 | tee "$tmplog"
              rc=${PIPESTATUS[0]}
              if [ "$rc" -ne 0 ]; then
                rm -f "$tmplog"
                return $rc
              fi
              if grep -qE "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog"; then
                echo "ERROR: analyzer load failure detected in compile output for $src" >&2
                grep -E "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog" >&2
                rm -f "$tmplog"
                return 1
              fi
              rm -f "$tmplog"
            else
              AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}"
            fi
          }

          # Production apps always get the analyzer flags (when configured).
          for d in $APP_DIRS; do
            [ -z "$d" ] && continue
            compile_dir "project/$d" "${ANALYZER_FLAGS[@]}"
          done

          # Test apps get analyzer flags only when explicitly opted in.
          # Mirrors AL-Go's default of "analyzers don't run on test apps."
          for d in $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            mkdir -p "project/$d/.alpackages"
            cp build/*.app "project/$d/.alpackages/" 2>/dev/null || true
            if [ "$ENABLE_CODE_ANALYZERS_ON_TEST_APPS" = "true" ]; then
              compile_dir "project/$d" "${ANALYZER_FLAGS[@]}"
            else
              compile_dir "project/$d"
            fi
          done

          bash bc-linux/scripts/workflow-summary.sh end COMPILE

      # ─── Phase 6: synchronization point — wait for BC to be healthy ──
      - name: Wait for BC healthy
        working-directory: bc-linux
        run: |
          # Shared readiness loop — same one the reusable workflow uses.
          # It prints what BC's entrypoint is doing every 60s instead of
          # leaving you staring at silence for several minutes.
          ./scripts/wait-for-bc-healthy.sh 30
          bash scripts/workflow-summary.sh end BC_BOOT

      # Run before the positive-only publish/smoke path below, same as the
      # reusable workflow: this is what catches a client-services wire-format
      # regression instead of every later step passing with a wrong password.
      - name: Verify NavUserPassword authentication
        working-directory: bc-linux
        run: ./scripts/test-authentication.sh

      # ─── Phase 7: publish compiled apps to the now-running BC ────────
      - name: Publish AL apps to BC
        env:
          AUTH: "BCRUNNER:Admin123!"
          DEV: "http://localhost:7049/BC/dev"
        run: |
          set -e
          bash bc-linux/scripts/workflow-summary.sh begin PUBLISH "Publish AL apps"
          # Source the canonical publish helper from bc-linux rather than
          # inlining a copy. The inline version treated EVERY 422 as
          # success, which silently swallowed missing-dependency errors
          # and let the test run report "0 total, 0 passed, 0 failed"
          # with no clue why. bc_publish_app reads the response body and
          # only treats 422 as success when it actually says "already".
          # shellcheck disable=SC1091
          . bc-linux/scripts/publish-app.sh
          PUBLISHED_COUNT=0
          for d in $APP_DIRS $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            app="build/$(basename "$d").app"
            [ -f "$app" ] || { echo "missing: $app"; exit 1; }
            echo ">>> Publishing $app"
            bc_publish_app "$app" "$DEV" "$AUTH" || exit 1
            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
          done
          bash bc-linux/scripts/workflow-summary.sh count apps_published "$PUBLISHED_COUNT"
          COMPILED_COUNT=$(ls build/*.app 2>/dev/null | wc -l)
          bash bc-linux/scripts/workflow-summary.sh count apps_compiled "$COMPILED_COUNT"
          bash bc-linux/scripts/workflow-summary.sh end PUBLISH

      # Always the websocket runner (scripts/run-tests.sh), not the reusable
      # workflow's test_runner=auto hybrid split — that split depends on the
      # altool/TestRunnerHub runner (BC 28+, opt-in), and this example is
      # meant to work unmodified on every supported BC version. Copy from
      # .github/workflows/bc-test-from-source.yml in bc-linux directly if you
      # need the faster hybrid path and are pinned to BC 28+.
      - name: Run AL tests
        working-directory: bc-linux
        run: |
          set -e
          bash scripts/workflow-summary.sh begin TESTS "Run AL tests"
          # Iterate only the test apps (we know which ones from TEST_APP_DIRS).
          # Production apps in APP_DIRS are already published but we don't run
          # tests on them — they have no test codeunits.
          TESTS_TOTAL=0; TESTS_PASSED=0; TESTS_FAILED=0; CODEUNITS_TOTAL=0
          for d in $TEST_APP_DIRS; do
            [ -z "$d" ] && continue
            app="../build/$(basename "$d").app"
            [ -f "$app" ] || { echo "skip: $app (not built)"; continue; }
            base=$(basename "$app")
            echo "=== Running tests in $base ==="
            tmplog=$(mktemp)
            ./scripts/run-tests.sh \
              --app "$app" \
              --codeunit-range "$CODEUNIT_RANGE" \
              --timeout 30 2>&1 | tee "$tmplog"
            line=$(grep -oE '[0-9]+ total, [0-9]+ passed, [0-9]+ failed' "$tmplog" | tail -1 || true)
            if [ -n "$line" ]; then
              t=$(echo "$line" | grep -oE '^[0-9]+')
              p=$(echo "$line" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
              f=$(echo "$line" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
              TESTS_TOTAL=$((TESTS_TOTAL + ${t:-0}))
              TESTS_PASSED=$((TESTS_PASSED + ${p:-0}))
              TESTS_FAILED=$((TESTS_FAILED + ${f:-0}))
            fi
            cu=$(grep -oE 'Test codeunits: [^ ]+' "$tmplog" | head -1 | sed 's/Test codeunits: //')
            if [ -n "$cu" ]; then
              n=$(echo "$cu" | tr ',' '\n' | grep -c .)
              CODEUNITS_TOTAL=$((CODEUNITS_TOTAL + n))
            fi
            rm -f "$tmplog"
          done
          bash scripts/workflow-summary.sh count tests_total    "$TESTS_TOTAL"
          bash scripts/workflow-summary.sh count tests_passed   "$TESTS_PASSED"
          bash scripts/workflow-summary.sh count tests_failed   "$TESTS_FAILED"
          bash scripts/workflow-summary.sh count codeunits_total "$CODEUNITS_TOTAL"
          bash scripts/workflow-summary.sh end TESTS

      - name: Workflow timing summary + telemetry
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BC_TELEMETRY_OPT_OUT: ${{ vars.BC_TELEMETRY_OPT_OUT || 'false' }}
        run: bash bc-linux/scripts/workflow-summary.sh emit

      - name: BC logs (on failure)
        if: failure()
        working-directory: bc-linux
        run: docker compose logs bc | tail -200

      # Last step, and after the log dump — the containers have to still be
      # ours while that runs. No `docker compose down`: the next job does its
      # own, and leaving the stack up is what keeps a self-hosted runner's
      # warm-volume path warm.
      - name: Release the BC container stack
        if: always()
        run: bash bc-linux/scripts/ci-lock.sh release bc-linux
