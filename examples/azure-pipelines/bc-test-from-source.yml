# Azure DevOps pipeline for running AL tests on a Business Central NST
# running on Linux. Compiles your AL source (app + test apps) inside the
# pipeline and publishes the compiled .app files to BC.
#
# Powered by StefanMaron/MsDyn365Bc.On.Linux — runs unmodified Microsoft BC
# on Linux via runtime patching of the Windows .NET service tier.
# Image: ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest (public).
#
# ──────────────────────────────────────────────────────────────────────
# HOW TO USE
# ──────────────────────────────────────────────────────────────────────
# 1. Copy this file into your repo as azure-pipelines.yml (or any name —
#    set it as the YAML file in your Azure DevOps Pipeline definition).
# 2. Edit the values in the "variables:" block to match your repo:
#      - BC_VERSION / BC_COUNTRY     → which BC version to test against
#      - APP_DIRS                    → space-separated dirs with app.json
#                                      for your production app(s).
#                                      Leave empty if you only have test apps.
#      - TEST_APP_DIRS               → space-separated dirs with app.json
#                                      for your test app(s)
#      - CODEUNIT_RANGE              → ID range of your TEST codeunits to
#                                      execute. Production codeunits in
#                                      APP_DIRS are published but not run.
# 3. Save + run. The pipeline runs on every push to main and PR.
#
# Requires a Microsoft-hosted Ubuntu agent (default `ubuntu-latest`) which
# already has Docker, Docker Compose, .NET 8 SDK, and curl preinstalled.
# ──────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include: [main, master]

pr:
  branches:
    include: [main, master]

# Point this at a self-hosted pool to get the warm-filesystem paths: the
# artifact cache (ARTIFACT_CACHE_DIR below), plus the patched service-tier and
# compiled-assembly volumes, which the entrypoint stamps and reuses on its own
# with nothing to configure here.
pool:
  vmImage: 'ubuntu-latest'

variables:
  # ----- Edit these for your project ----------------------------------
  BC_VERSION: '27.5'
  BC_COUNTRY: 'w1'
  BC_TYPE: 'sandbox'

  # Space-separated dirs containing app.json for your production AL apps.
  # Leave empty ('') if your repo only has test apps.
  APP_DIRS: 'app'

  # Space-separated dirs containing app.json for your test AL apps.
  TEST_APP_DIRS: 'test'

  # IDs of your TEST codeunits to execute. APP_DIRS are published but
  # their codeunits aren't run — only TEST_APP_DIRS codeunits are executed.
  #
  # Accepted formats:
  #   '50000..99999'                       single AL range
  #   '50000..50100|130450..130459'        multiple ranges (pipe-separated)
  #   '50000,50001,50002'                  explicit ids
  #   '50000..50100,130450,200000..210000' mixed
  CODEUNIT_RANGE: '50000..99999'


  # AL compiler tool version. Leave blank to auto-derive from BC_VERSION
  # (recommended): BC 27.x → 16.2.28.57946, BC 28.x → 17.0.34.45391.
  # Set explicitly to pin a specific version.
  AL_TOOL_VERSION: ''

  # AL runtime version written into all app.json files before compile.
  # Auto-derived from BC_VERSION when blank: BC 27 → 16.0, BC 28 → 17.0.
  RUNTIME_VERSION: ''

  # Comma-separated preprocessor symbols passed to /define.
  # Example: 'BC27PLUS,BC28PLUS' for a version-gated matrix leg.
  PREPROCESSOR_SYMBOLS: ''

  # ─── Optional: analyzers + ruleset ───────────────────────────────────
  # All off by default. Set to 'true' / fill in to enable. The compile
  # step fails the pipeline if any cop DLL fails to load (AD0001,
  # 'Could not load', BadImageFormatException, PlatformNotSupportedException),
  # so a misconfigured cop can never produce a silently green build.
  # See ANALYZER-SUPPORT-PLAN.md in the bc-linux repo for the gotchas.
  ENABLE_CODE_COP: 'false'
  ENABLE_UI_COP: 'false'
  ENABLE_APP_SOURCE_COP: 'false'
  ENABLE_PER_TENANT_EXTENSION_COP: 'false'
  # Comma- or newline-separated list of additional cop DLLs. Each entry
  # is either a local path or an https:// URL. .nupkg URLs are unzipped
  # and every DLL under lib/net8.0/ is added — pointing at the ALCops
  # release nupkg makes all 7 cops + ALCops.Common.dll come along
  # automatically. Example:
  #   'https://github.com/ALCops/Analyzers/releases/download/v0.6.1/ALCops.Analyzers.0.6.1.nupkg'
  CUSTOM_CODE_COPS: ''
  # JSON ruleset (NOT the classic VS XML .ruleset format). Local repo
  # path or https:// URL.
  RULESET_FILE: ''
  # Set to 'true' if RULESET_FILE has includedRuleSets[].path entries
  # pointing at https:// URLs (e.g. shared org-wide rulesets in a public
  # repo). Required by the AL compiler for any URL-scheme include.
  ENABLE_EXTERNAL_RULESETS: 'false'
  # Mirror AL-Go's default: analyzers don't run on test apps. Set to
  # 'true' to enforce cops on test apps too.
  ENABLE_CODE_ANALYZERS_ON_TEST_APPS: 'false'
  # --------------------------------------------------------------------

  # bc-linux runtime image (publicly available on GHCR — no auth needed).
  BC_RUNNER_IMAGE: 'ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest'

  # Where the extracted BC artifacts are kept. The default is inside the
  # pipeline workspace, which is correct for a Microsoft-hosted agent: the VM
  # is fresh every run, so the directory is always empty and the download
  # happens exactly as it always did.
  #
  # On a SELF-HOSTED agent, point this at a path OUTSIDE the workspace
  # (e.g. /var/cache/bc-artifacts) and the ~2 GB download is skipped entirely
  # whenever that directory already holds the same resolved build. Concurrent
  # jobs are safe - download-artifacts.sh locks the directory, so the second
  # job waits and then hits the cache the first one wrote. Budget ~3.1 GB per
  # BC version kept.
  ARTIFACT_CACHE_DIR: '$(Pipeline.Workspace)/artifact-cache'

  # Git ref of MsDyn365Bc.On.Linux to use for scripts (master, tag, or SHA).
  BC_LINUX_REF: 'master'

steps:
  - checkout: self
    path: project

  - bash: |
      set -e
      git clone --depth 1 --branch "$(BC_LINUX_REF)" \
        https://github.com/StefanMaron/MsDyn365Bc.On.Linux.git \
        "$(Agent.BuildDirectory)/bc-linux"
      ls "$(Agent.BuildDirectory)/bc-linux"
    displayName: 'Clone MsDyn365Bc.On.Linux'

  - bash: bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" init
    displayName: 'Initialize timing'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin DOWNLOAD "Download BC artifacts + pull docker images"
      mkdir -p "$(ARTIFACT_CACHE_DIR)/$(BC_VERSION)"
      (
        "$(Agent.BuildDirectory)/bc-linux/scripts/download-artifacts.sh" \
          "$(BC_TYPE)" "$(BC_VERSION)" "$(BC_COUNTRY)" \
          "$(ARTIFACT_CACHE_DIR)/$(BC_VERSION)"
      ) &
      ARTIFACT_PID=$!
      (
        cd "$(Agent.BuildDirectory)/bc-linux"
        # compose-pull.sh retries transient registry failures (mcr
        # occasionally WAF-blocks runner IPs) but aborts immediately on a
        # permanent one. The inline loop it replaced slept 15s x5 on
        # "manifest unknown", turning a wrong or not-yet-published tag
        # into 60s of silent dead time.
        bash scripts/compose-pull.sh
      ) &
      PULL_PID=$!
      wait $ARTIFACT_PID || { echo "artifact download failed"; exit 1; }
      wait $PULL_PID     || { echo "docker pull failed"; exit 1; }
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end DOWNLOAD
    displayName: 'Download BC artifacts + pull docker images (parallel)'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin RESOLVE "Resolve apps to keep"
      # Seed the closure with bc-linux's own TestRunnerExtension app.json.
      # It declares a dependency on Microsoft's Test Runner, which most
      # consumer test apps do NOT declare — they depend on Library Assert
      # and Tests-TestLibraries instead. Without this seed Test Runner falls
      # outside the closure, the selective filter wipes it in SQL, and the
      # entrypoint's TestRunnerExtension publish then fails with AL1024.
      # Seeding via app.json rather than a hardcoded GUID list keeps the
      # closure self-maintaining.
      ARGS="--app-json $(Agent.BuildDirectory)/bc-linux/extensions/TestRunnerExtension/app.json"
      cd "$(Pipeline.Workspace)/project"
      for d in $(APP_DIRS) $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        [ -f "$d/app.json" ] && ARGS="$ARGS --app-json $d/app.json"
      done
      KEEP_IDS=$(python3 "$(Agent.BuildDirectory)/bc-linux/scripts/resolve-keep-app-ids.py" \
        $ARGS \
        --artifact-dir "$(ARTIFACT_CACHE_DIR)/$(BC_VERSION)")
      echo "Resolved keep set: $KEEP_IDS"
      echo "##vso[task.setvariable variable=BC_CLEAR_ALL_APPS]selective"
      echo "##vso[task.setvariable variable=BC_KEEP_APP_IDS]$KEEP_IDS"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end RESOLVE
    displayName: 'Resolve apps to keep in BC database'

  # Optional: stage an ISV/developer license. Without this step BC boots
  # with the public Cronus license. To use your own license, store its
  # base64-encoded content in the variable group as BC_LICENSE_B64 and
  # mark it as a secret. The entrypoint imports the license BEFORE NST
  # starts, so no boot/import/restart cycle is needed. No-op when unset.
  - bash: |
      set -e
      # Azure DevOps does NOT substitute an undefined variable: when
      # BC_LICENSE_B64 doesn't exist, `env:` below passes through the
      # literal string $(BC_LICENSE_B64), which is not empty. A plain
      # `[ -z ... ]` guard therefore never fires and base64 -d chokes on
      # the placeholder. Treat the un-substituted macro as "unset".
      # The placeholder is spelled with a quote break ('$''(...') so that
      # the agent's own macro expansion can't rewrite it here when the
      # variable IS defined — otherwise the comparison would match the
      # real license and silently skip it.
      UNSET_PLACEHOLDER='$''(BC_LICENSE_B64)'
      case "${BC_LICENSE_B64:-}" in
        ''|"$UNSET_PLACEHOLDER")
          echo "BC_LICENSE_B64 not set; skipping (default Cronus license will be used)"
          exit 0
          ;;
      esac
      LICENSE_PATH="$(Agent.TempDirectory)/bc-license.bclicense"
      printf '%s' "$BC_LICENSE_B64" | base64 -d > "$LICENSE_PATH"
      [ -s "$LICENSE_PATH" ] || { echo "ERROR: BC_LICENSE_B64 decoded to an empty file"; exit 1; }
      chmod 644 "$LICENSE_PATH"
      echo "##vso[task.setvariable variable=BC_LICENSE_HOST_PATH]$LICENSE_PATH"
      echo "##vso[task.setvariable variable=BC_LICENSE_FILE]/bc/custom-license.bclicense"
    env:
      BC_LICENSE_B64: $(BC_LICENSE_B64)
    displayName: 'Stage ISV license (if BC_LICENSE_B64 is set)'

  # Compose names its project after the working directory's basename —
  # `bc-linux` here and in every other pipeline — and docker-compose.yml binds
  # fixed host ports. Two jobs on one docker host therefore drive the SAME
  # containers, and the second one's `docker compose down` in the next step
  # deletes the first one's BC mid-test (issue #24). ci-lock.sh serializes them
  # on a machine-wide lease.
  #
  # On a Microsoft-hosted agent this is a no-op — the VM belongs to this job.
  # It earns its place the moment you move to a self-hosted agent, which is
  # also when the artifact cache and the warm service-tier volume start paying
  # off.
  #
  # The token has to reach the release step at the bottom of the job, and an
  # `export` does not survive a step boundary here — hence the setvariable.
  - bash: |
      set -e
      cd "$(Agent.BuildDirectory)/bc-linux"
      bash scripts/ci-lock.sh acquire bc-linux \
        --wait-minutes 35 --max-hold-minutes 45 | tee /tmp/ci-lock-acquire.log
      rc=${PIPESTATUS[0]}
      [ "$rc" -eq 0 ] || exit "$rc"
      TOKEN=$(sed -n 's/^BC_CI_LOCK_TOKEN=//p' /tmp/ci-lock-acquire.log)
      echo "##vso[task.setvariable variable=BC_CI_LOCK_TOKEN]$TOKEN"
    displayName: 'Reserve the BC container stack on this machine'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin BC_BOOT "BC startup (background → wait for healthy)"
      cd "$(Agent.BuildDirectory)/bc-linux"
      export BC_ARTIFACTS_DIR="$(ARTIFACT_CACHE_DIR)/$(BC_VERSION)"
      export BC_VERSION="$(BC_VERSION)"
      export BC_COUNTRY="$(BC_COUNTRY)"
      export BC_TYPE="$(BC_TYPE)"
      export BC_RUNNER_IMAGE="$(BC_RUNNER_IMAGE)"
      export BC_CLEAR_ALL_APPS="$(BC_CLEAR_ALL_APPS)"
      export BC_KEEP_APP_IDS="$(BC_KEEP_APP_IDS)"
      # ISV license overrides (set by the previous step when BC_LICENSE_B64
      # is provided as a secret variable). Empty/unset = default Cronus.
      export BC_LICENSE_HOST_PATH="${BC_LICENSE_HOST_PATH:-}"
      export BC_LICENSE_FILE="${BC_LICENSE_FILE:-}"
      # Clear any leftover compose state before starting. On a Microsoft-hosted
      # runner this is a no-op (fresh VM, nothing to remove). On a self-hosted
      # one the previous job's bc/sql containers may still be running, and
      # `docker compose up -d` adopts a running container instead of recreating
      # it — the healthcheck then goes green in seconds against the PREVIOUS
      # run's database and published apps, which looks like a very fast pass.
      # Named volumes are kept on purpose: the entrypoint stamps /bc/service
      # and reuses it only when it matches this platform + image, so the warm
      # path stays warm without going stale.
      docker compose down --remove-orphans 2>/dev/null || true
      docker compose up -d
      echo "BC container started in background — continuing with other work."
    displayName: 'Start BC on Linux (background)'

  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - bash: |
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin AL_INSTALL "Install AL compiler"
      # Resolution, package-shape fallback (Microsoft has been known to
      # reshuffle where the compiler binary lives inside a BC preview's AL
      # nupkg without warning — see install-al-compiler.sh's header for the
      # specific incident this guards against) and the AL wrapper all live
      # in the shared script so this logic exists in exactly one place
      # across the reusable workflow and both examples/ pipelines.
      if ! INSTALL_OUT=$(bash "$(Agent.BuildDirectory)/bc-linux/scripts/install-al-compiler.sh" "$(BC_VERSION)" "$(AL_TOOL_VERSION)"); then
        exit 1
      fi
      eval "$INSTALL_OUT"
      echo "##vso[task.prependpath]$AL_BIN_DIR"
      # Exported so the compile step can point resolve-analyzers.py at
      # the Microsoft cop DLLs — its auto-detection only knows the
      # dotnet-tool layout, not the extracted-nupkg one.
      echo "##vso[task.setvariable variable=AL_TOOL_DIR]$AL_TOOL_DIR"
      echo "AL compiler ready: $AL_TOOL_DIR"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end AL_INSTALL
    displayName: 'Install Linux AL compiler'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin SYMBOLS "Stage symbols"
      mkdir -p "$(Pipeline.Workspace)/symbols"
      # Manifest-driven resolver: walks the artifact tree, indexes every
      # .app by its declared id, then stages exactly the transitive
      # dependency closure of the consumer's app.json files (plus
      # System.app, which AL compile always needs). Robust to Microsoft
      # moving apps between folders across BC versions — the old
      # glob-based staging silently failed whenever an expected app moved
      # (e.g. Tests-TestLibraries under platform/applications/BaseApp/Test/
      # in BC 27.5).
      ARGS=""
      for d in $(APP_DIRS) $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        F="$(Pipeline.Workspace)/project/$d/app.json"
        [ -f "$F" ] && ARGS="$ARGS --app-json $F"
      done
      python3 "$(Agent.BuildDirectory)/bc-linux/scripts/stage-symbols.py" \
        $ARGS \
        --artifact-dir "$(ARTIFACT_CACHE_DIR)/$(BC_VERSION)" \
        --out-dir "$(Pipeline.Workspace)/symbols" \
        || true   # warnings about unresolved deps are non-fatal; AL compile gives the precise error if any
      echo "Staged $(ls "$(Pipeline.Workspace)"/symbols/*.app 2>/dev/null | wc -l) symbol files"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end SYMBOLS
    displayName: 'Stage symbols from BC artifacts'

  - bash: |
      EFFECTIVE_RUNTIME="$(RUNTIME_VERSION)"
      BC_MAJOR=$(echo "$(BC_VERSION)" | cut -d. -f1)
      if [ -z "$EFFECTIVE_RUNTIME" ]; then
        # Same BC-major-minus-11 rule as the compiler version.
        if ! EFFECTIVE_RUNTIME=$(python3 "$(Agent.BuildDirectory)/bc-linux/scripts/resolve-al-tool-version.py" "$(BC_VERSION)" --runtime); then
          echo "##vso[task.logissue type=error]Could not resolve an AL runtime version for BC $(BC_VERSION)"
          exit 1
        fi
      fi
      echo "Patching app.json runtime → $EFFECTIVE_RUNTIME"
      for d in $(APP_DIRS) $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        F="$(Pipeline.Workspace)/project/$d/app.json"
        [ -f "$F" ] || continue
        python3 - "$F" "$EFFECTIVE_RUNTIME" <<'PYEOF'
      import sys, json, pathlib
      p = pathlib.Path(sys.argv[1])
      d = json.loads(p.read_text())
      if d.get("runtime") != sys.argv[2]:
          d["runtime"] = sys.argv[2]
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(f"  patched {p}: runtime → {sys.argv[2]}")
      else:
          print(f"  {p}: runtime already {sys.argv[2]}, skip")
      PYEOF
      done
    displayName: 'Patch app.json runtime'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin COMPILE "Compile AL apps"
      SYMBOLS="$(Pipeline.Workspace)/symbols"
      BUILD_DIR="$(Pipeline.Workspace)/build"
      mkdir -p "$BUILD_DIR"

      # ─── Resolve analyzer flags via the helper ──────────────────────
      # Build the helper invocation only when SOMETHING is configured.
      # When nothing is set, ANALYZER_FLAGS stays empty and the compile
      # commands run exactly as they did before this feature existed.
      # resolve-analyzers.py handles Microsoft cop path resolution from
      # the AL tool dir, downloading URL-referenced custom cops, .nupkg
      # auto-extraction (so ALCops.Common.dll comes along automatically),
      # and remote ruleset downloads.
      HELPER_ARGS=()
      [ "$(ENABLE_CODE_COP)" = "true" ] && HELPER_ARGS+=(--enable-code-cop)
      [ "$(ENABLE_UI_COP)" = "true" ] && HELPER_ARGS+=(--enable-ui-cop)
      [ "$(ENABLE_APP_SOURCE_COP)" = "true" ] && HELPER_ARGS+=(--enable-app-source-cop)
      [ "$(ENABLE_PER_TENANT_EXTENSION_COP)" = "true" ] && HELPER_ARGS+=(--enable-per-tenant-extension-cop)
      [ -n "$(CUSTOM_CODE_COPS)" ] && HELPER_ARGS+=(--custom-code-cops "$(CUSTOM_CODE_COPS)")
      [ -n "$(RULESET_FILE)" ] && HELPER_ARGS+=(--ruleset-file "$(RULESET_FILE)")
      [ "$(ENABLE_EXTERNAL_RULESETS)" = "true" ] && HELPER_ARGS+=(--enable-external-rulesets)

      # Run the helper to a tempfile rather than via process substitution.
      # `mapfile -t < <(python3 ...)` SILENTLY SWALLOWS the helper's exit
      # code, so if the helper bails on a missing path the pipeline
      # silently compiles without analyzers and reports a green build.
      # The tempfile pattern lets `if ! ...` see the real exit code.
      # --project-root tells the helper where the consumer checkout
      # lives so non-URL paths get resolved relative to the repo root.
      ANALYZER_FLAGS=()
      if [ ${#HELPER_ARGS[@]} -gt 0 ]; then
        HELPER_OUT=$(mktemp)
        # --al-tool-dir is where the Microsoft cop DLLs live. Pass it
        # explicitly: on BC 28+ the compiler comes from an extracted
        # nupkg, which the helper's auto-detection doesn't know about.
        if ! python3 "$(Agent.BuildDirectory)/bc-linux/scripts/resolve-analyzers.py" \
            --project-root "$(Pipeline.Workspace)/project" \
            ${AL_TOOL_DIR:+--al-tool-dir "$AL_TOOL_DIR"} \
            "${HELPER_ARGS[@]}" > "$HELPER_OUT"; then
          echo "ERROR: resolve-analyzers.py failed — check stderr above" >&2
          rm -f "$HELPER_OUT"
          exit 1
        fi
        mapfile -t ANALYZER_FLAGS < "$HELPER_OUT"
        rm -f "$HELPER_OUT"
        echo "Analyzer flags: ${ANALYZER_FLAGS[*]}"
      fi

      # ─── Pattern that catches every analyzer load failure mode ─────
      # AL compile reports these as WARNINGS (AD0001 specifically), so
      # without this guard a misconfigured cop would silently disable
      # itself and the pipeline would report a green build with no cops
      # actually enforced. Failing here is the only way you learn your
      # cop wiring is broken.
      ANALYZER_LOAD_FAIL_PATTERN='AD0001|Could not load|BadImageFormatException|PlatformNotSupportedException'

      PP_FLAG=()
      [ -n "$(PREPROCESSOR_SYMBOLS)" ] && PP_FLAG=("/define:$(PREPROCESSOR_SYMBOLS)")

      compile_dir() {
        local src="$1"
        shift
        [ -f "$src/app.json" ] || { echo "skip $src (no app.json)" >&2; return 0; }
        mkdir -p "$src/.alpackages"
        cp "$SYMBOLS"/*.app "$src/.alpackages/" 2>/dev/null || true
        local out="$BUILD_DIR/$(basename "$src").app"
        echo ">>> Compiling $src → $out"
        # Remaining args ($@) are the analyzer flag fragments — may be empty.
        if [ "$#" -gt 0 ]; then
          local tmplog rc
          tmplog=$(mktemp)
          AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}" "$@" 2>&1 | tee "$tmplog"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            rm -f "$tmplog"
            return $rc
          fi
          if grep -qE "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog"; then
            echo "ERROR: analyzer load failure detected in compile output for $src" >&2
            grep -E "$ANALYZER_LOAD_FAIL_PATTERN" "$tmplog" >&2
            rm -f "$tmplog"
            return 1
          fi
          rm -f "$tmplog"
        else
          AL compile "/project:$src" "/packagecachepath:$src/.alpackages" "/out:$out" "${PP_FLAG[@]}"
        fi
      }

      cd "$(Pipeline.Workspace)/project"
      # Production apps always get the analyzer flags (when configured).
      for d in $(APP_DIRS); do
        [ -z "$d" ] && continue
        compile_dir "$d" "${ANALYZER_FLAGS[@]}"
      done
      # Test apps get analyzer flags only when explicitly opted in.
      # Mirrors AL-Go's default of "analyzers don't run on test apps."
      for d in $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        mkdir -p "$d/.alpackages"
        cp "$BUILD_DIR"/*.app "$d/.alpackages/" 2>/dev/null || true
        if [ "$(ENABLE_CODE_ANALYZERS_ON_TEST_APPS)" = "true" ]; then
          compile_dir "$d" "${ANALYZER_FLAGS[@]}"
        else
          compile_dir "$d"
        fi
      done
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end COMPILE
    displayName: 'Compile AL apps (no publish yet)'

  - bash: |
      set -e
      cd "$(Agent.BuildDirectory)/bc-linux"
      # Shared readiness loop — same one the reusable workflow uses. It
      # prints what BC's entrypoint is doing every 60s instead of leaving
      # you staring at silence for several minutes.
      ./scripts/wait-for-bc-healthy.sh 30
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end BC_BOOT
    displayName: 'Wait for BC healthy'

  - bash: |
      set -e
      cd "$(Agent.BuildDirectory)/bc-linux"
      # Run before the positive-only publish/smoke path below, same as the
      # reusable workflow: this is what catches a client-services wire-format
      # regression instead of every later step passing with a wrong password.
      ./scripts/test-authentication.sh
    displayName: 'Verify NavUserPassword authentication'

  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin PUBLISH "Publish AL apps"
      AUTH="BCRUNNER:Admin123!"
      DEV="http://localhost:7049/BC/dev"
      BUILD_DIR="$(Pipeline.Workspace)/build"
      # Source the canonical publish helper from bc-linux rather than
      # inlining a copy. The inline version treated EVERY 422 as success,
      # which silently swallowed missing-dependency errors and let the
      # test run report "0 total, 0 passed, 0 failed" with no clue why.
      # bc_publish_app reads the response body and only treats 422 as
      # success when it actually says "already".
      # shellcheck disable=SC1091
      . "$(Agent.BuildDirectory)/bc-linux/scripts/publish-app.sh"
      PUBLISHED_COUNT=0
      for d in $(APP_DIRS) $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        app="$BUILD_DIR/$(basename "$d").app"
        [ -f "$app" ] || { echo "missing: $app"; exit 1; }
        echo ">>> Publishing $app"
        bc_publish_app "$app" "$DEV" "$AUTH" || exit 1
        PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
      done
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count apps_published "$PUBLISHED_COUNT"
      COMPILED_COUNT=$(ls "$BUILD_DIR"/*.app 2>/dev/null | wc -l)
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count apps_compiled "$COMPILED_COUNT"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end PUBLISH
    displayName: 'Publish AL apps to BC'

  # Always the websocket runner (scripts/run-tests.sh), not the reusable
  # workflow's test_runner=auto hybrid split — that split depends on the
  # altool/TestRunnerHub runner (BC 28+, opt-in), and this example is meant
  # to work unmodified on every supported BC version. Copy from
  # .github/workflows/bc-test-from-source.yml in bc-linux directly if you
  # need the faster hybrid path and are pinned to BC 28+.
  - bash: |
      set -e
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" begin TESTS "Run AL tests"
      cd "$(Agent.BuildDirectory)/bc-linux"
      TESTS_TOTAL=0; TESTS_PASSED=0; TESTS_FAILED=0; CODEUNITS_TOTAL=0
      for d in $(TEST_APP_DIRS); do
        [ -z "$d" ] && continue
        app="$(Pipeline.Workspace)/build/$(basename "$d").app"
        [ -f "$app" ] || { echo "skip: $app (not built)"; continue; }
        base=$(basename "$app")
        echo "=== Running tests in $base ==="
        tmplog=$(mktemp)
        ./scripts/run-tests.sh \
          --app "$app" \
          --codeunit-range "$(CODEUNIT_RANGE)" \
          --timeout 30 2>&1 | tee "$tmplog"
        line=$(grep -oE '[0-9]+ total, [0-9]+ passed, [0-9]+ failed' "$tmplog" | tail -1 || true)
        if [ -n "$line" ]; then
          t=$(echo "$line" | grep -oE '^[0-9]+')
          p=$(echo "$line" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          f=$(echo "$line" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
          TESTS_TOTAL=$((TESTS_TOTAL + ${t:-0}))
          TESTS_PASSED=$((TESTS_PASSED + ${p:-0}))
          TESTS_FAILED=$((TESTS_FAILED + ${f:-0}))
        fi
        cu=$(grep -oE 'Test codeunits: [^ ]+' "$tmplog" | head -1 | sed 's/Test codeunits: //')
        if [ -n "$cu" ]; then
          n=$(echo "$cu" | tr ',' '\n' | grep -c .)
          CODEUNITS_TOTAL=$((CODEUNITS_TOTAL + n))
        fi
        rm -f "$tmplog"
      done
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count tests_total    "$TESTS_TOTAL"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count tests_passed   "$TESTS_PASSED"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count tests_failed   "$TESTS_FAILED"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" count codeunits_total "$CODEUNITS_TOTAL"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" end TESTS
    displayName: 'Run AL tests'

  - bash: |
      JOB_STATUS=success
      [ "$AGENT_JOBSTATUS" = "Failed" ] || [ "$AGENT_JOBSTATUS" = "SucceededWithIssues" ] && JOB_STATUS=failure
      [ "$AGENT_JOBSTATUS" = "Cancelled" ] && JOB_STATUS=cancelled
      export JOB_STATUS
      export BC_TELEMETRY_OPT_OUT="${BC_TELEMETRY_OPT_OUT:-false}"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/workflow-summary.sh" emit
    displayName: 'Workflow timing summary + telemetry'
    condition: always()

  - bash: |
      cd "$(Agent.BuildDirectory)/bc-linux"
      docker compose logs bc | tail -200
    displayName: 'BC logs (on failure)'
    condition: failed()

  # Last step, and after the log dump — the containers have to still be ours
  # while that runs. No `docker compose down`: the next job does its own, and
  # leaving the stack up is what keeps a self-hosted agent's warm-volume path
  # warm.
  #
  # If the acquire step never ran, Azure leaves the macro unexpanded and the
  # token will not match the lease — release then refuses rather than handing
  # a running job's stack to somebody else, and the lease is reclaimed on its
  # own once the heartbeat stops.
  - bash: |
      export BC_CI_LOCK_TOKEN="$(BC_CI_LOCK_TOKEN)"
      bash "$(Agent.BuildDirectory)/bc-linux/scripts/ci-lock.sh" release bc-linux
    displayName: 'Release the BC container stack'
    condition: always()
