services:
  sql:
    # Defaults to our GHCR mirror of mcr.microsoft.com/mssql/server:2022-latest,
    # with the layers recompressed to zstd. Two separate problems:
    #
    #  1. mcr is slow and flaky from GitHub runners. Measured 6 MB/s on one
    #     consumer run (105s for the 625 MB image, making it the binding
    #     constraint of the whole fetch phase) and 14-29s on others. It also
    #     intermittently WAF-blocks runner IPs, which is why the pull is
    #     wrapped in a retry (scripts/compose-pull.sh).
    #  2. The pull cost is mostly layer decompression, not transfer. GitHub
    #     gives private repos 2-vCPU runners and public repos 4-vCPU ones, and
    #     the same gzip image measured ~45s on a 2-vCPU box against 16s on a
    #     4-vCPU box. zstd inflates far faster and the image is smaller too:
    #     488 MB vs 625 MB.
    #
    # Both tags carry identical image content and are refreshed by
    # .github/workflows/mirror-sql-image.yml. If a consumer's Docker ever
    # chokes on zstd layers, `:2022` is the byte-identical gzip copy and is
    # the one-line rollback.
    #
    # Override with BC_SQL_IMAGE to use it, to go straight to mcr, to pull
    # from your own registry, or to pin a different SQL Server version:
    #   BC_SQL_IMAGE=ghcr.io/stefanmaron/msdyn365bc.on.linux/mssql:2022 docker compose up -d
    #   BC_SQL_IMAGE=mcr.microsoft.com/mssql/server:2022-latest docker compose up -d
    #
    # Apps using AL's `OptimizeForTextSearch = true` need the Full-Text
    # Search component, which no official SQL Server Linux image ships.
    # Use the :2022-fts variant for those — opt-in because FTS adds ~550 MB
    # to the image. See KNOWN-LIMITATIONS.md (issue #20):
    #   BC_SQL_IMAGE=ghcr.io/stefanmaron/msdyn365bc.on.linux/mssql:2022-fts docker compose up -d
    image: ${BC_SQL_IMAGE:-ghcr.io/stefanmaron/msdyn365bc.on.linux/mssql:2022-zstd}
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-Passw0rd123!}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "${SQL_PORT:-11433}:1433"
    tmpfs:
      - /var/opt/mssql/data:size=4g,uid=10001,gid=10001
    volumes:
      - ${BC_ARTIFACTS_DIR:-bc-artifacts}:/bc/artifacts:ro
      # Custom license bind mount also exposed to SQL Server, because the
      # entrypoint imports the license via OPENROWSET BULK which reads the
      # file from SQL's filesystem (not bc's). Same default of /dev/null
      # when BC_LICENSE_HOST_PATH is unset — see notes on the bc service.
      - ${BC_LICENSE_HOST_PATH:-/dev/null}:/bc/custom-license.bclicense:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-Passw0rd123!}' -C -No -Q "SELECT 1" || exit 1
      # 5s interval: depends_on gates bc container creation on this check, so
      # its interval is dead time on every boot. SELECT 1 is negligible load.
      interval: 5s
      retries: 20
      start_period: 20s

  bc:
    image: ${BC_RUNNER_IMAGE:-ghcr.io/stefanmaron/msdyn365bc.on.linux/bc-runner:latest}
    # Pull the published image if it's not already in the local cache. Because a
    # `build:` section is present, Compose would otherwise BUILD on first `up`
    # (the Build Spec default) — which forces every community user through a
    # 5-10 min local build. `missing` flips that to pull-by-default; only an
    # explicit `docker compose build` rebuilds. Developers iterating on the image
    # build locally (which tags this same ref), so their build shadows the pull.
    # To track newer published builds: `docker compose pull bc`.
    pull_policy: missing
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/Dockerfile
    stdin_open: true
    depends_on:
      sql:
        # service_started, NOT service_healthy: the two containers boot in
        # parallel and bc waits for SQL itself.
        #
        # The entrypoint already blocks on `until sqlcmd ... SELECT 1`, so the
        # compose-level health gate was doing the same job a second time — and
        # doing it worse, because the healthcheck's 5s interval means the
        # earliest observable "healthy" is ~5s even when SQL is ready at 2s.
        # Measured 5.8s of dead time on every boot.
        #
        # What this buys is bounded by the gate, not by SQL: NST does not start
        # until Step 3 has restored the database, so it can never overlap SQL's
        # startup. What overlaps is the entrypoint's pre-SQL work — the artifact
        # copy and the service-tier patching. ~5-6s, which is below the noise
        # floor of a single A/B (CI-STEP-ORDERING.md) but deterministic.
        #
        # service_started rather than dropping depends_on entirely so the
        # dependency graph survives: `docker compose up bc` still brings sql up.
        condition: service_started
    ports:
      - "${BC_DEV_PORT:-7049}:7049"
      - "${BC_ODATA_PORT:-7048}:7048"
      - "${BC_API_PORT:-7052}:7052"
      - "${BC_MGMT_PORT:-7045}:7045"
      - "${BC_CLIENT_PORT:-7085}:7085"
      # Web client (PoC, opt-in via BC_WEBCLIENT=1 — see docs/WEBCLIENT-POC.md)
      - "${BC_WEBCLIENT_PORT:-8080}:8080"
    environment:
      BC_VERSION: ${BC_VERSION:-28.4}
      BC_COUNTRY: ${BC_COUNTRY:-w1}
      BC_TYPE: ${BC_TYPE:-sandbox}
      SA_PASSWORD: ${SA_PASSWORD:-Passw0rd123!}
      # The NavUserPassword login the entrypoint creates for OData/SOAP/dev-endpoint/
      # web-client sign-in (SUPER access). Defaults preserve the long-documented
      # BCRUNNER/Admin123! pair; override both to change the account name, e.g. when
      # a consumer's own tooling expects a specific username. The entrypoint derives
      # Microsoft's V3 representation from this password and Business Central's
      # original NavUser.TryAuthenticate implementation enforces it. This is still a
      # local dev/CI sandbox account; don't expose these ports to an untrusted network.
      BC_SERVER_USERNAME: ${BC_SERVER_USERNAME:-BCRUNNER}
      BC_SERVER_PASSWORD: ${BC_SERVER_PASSWORD:-Admin123!}
      BC_CLEAR_ALL_APPS: ${BC_CLEAR_ALL_APPS:-false}
      BC_SKIP_APP_PUBLISH: ${BC_SKIP_APP_PUBLISH:-false}
      BC_KEEP_APP_IDS: ${BC_KEEP_APP_IDS:-}
      # Custom license override: when set, the entrypoint imports the file
      # at this path INSTEAD of the artifact's default Cronus.bclicense.
      # The volume mount below makes /bc/custom-license.bclicense the
      # canonical mount point — set BC_LICENSE_HOST_PATH on the host shell
      # to the source file and BC_LICENSE_FILE=/bc/custom-license.bclicense
      # to wire it through. ISVs use this to skip the boot → import →
      # restart NST cycle on every fresh container.
      BC_LICENSE_FILE: ${BC_LICENSE_FILE:-}
      # Diagnostic only — comma-separated patch IDs to skip (e.g. "14,15,15a,15b,checkfile").
      # Used to bisect Cecil patches that may cause AL→C# emission drift. Empty = production.
      BC_DISABLE_PATCHES: ${BC_DISABLE_PATCHES:-}
      # Diagnostic only — 1 logs every thrown exception (very noisy).
      BC_DEBUG_FIRSTCHANCE: ${BC_DEBUG_FIRSTCHANCE:-}
      # Diagnostic only — 1 logs every managed assembly the runtime fails to find
      # on its own (Default ALC Resolving + AppDomain.AssemblyResolve). This is how
      # you turn BC's anonymous FileNotFoundException into an assembly name.
      BC_DEBUG_ASSEMBLY_RESOLVE: ${BC_DEBUG_ASSEMBLY_RESOLVE:-}
      # Diagnostic only — when 1, NST suspends at startup waiting for a diagnostic
      # client (dotnet-trace) on /tmp/nst-diag.sock. Used to profile cold boot.
      BC_PROFILE_NST: ${BC_PROFILE_NST:-0}
      BC_ARTIFACT_URL: ${BC_ARTIFACT_URL:-}
      BC_TEST_APPS: ${BC_TEST_APPS:-}
      # Opt-in: self-host Microsoft's real BC web client on Kestrel (port 8080).
      # EXPERIMENTAL PoC — see docs/WEBCLIENT-POC.md.
      BC_WEBCLIENT: ${BC_WEBCLIENT:-0}
      # Optional path prefix for a reverse proxy that routes by path on a single
      # shared hostname/port (e.g. "/my-tier"), instead of by hostname or port.
      # Reused for both Kestrel's bound URL and PublicWebBaseUrl. See
      # docs/WEBCLIENT-POC.md.
      BC_WEBCLIENT_PATHBASE: ${BC_WEBCLIENT_PATHBASE:-}
      # Set to 1 when a reverse proxy in front of the container terminates TLS,
      # so the web client emits https:// in its redirects instead of http://.
      # See docs/WEBCLIENT-POC.md.
      BC_WEBCLIENT_REQUIRE_SSL: ${BC_WEBCLIENT_REQUIRE_SSL:-}
      SQL_SERVER: sql
      # .NET runtime tuning. Defaults are inherited from the entrypoint
      # (gcServer=1, TieredCompilation=0). These pass-throughs let us A/B
      # test additional knobs without rebuilding the image.
      DOTNET_TieredCompilation: ${DOTNET_TieredCompilation:-}
      DOTNET_TC_QuickJitForLoops: ${DOTNET_TC_QuickJitForLoops:-}
      DOTNET_ReadyToRun: ${DOTNET_ReadyToRun:-}
      DOTNET_GCRetainVM: ${DOTNET_GCRetainVM:-}
      DOTNET_GCConserveMemory: ${DOTNET_GCConserveMemory:-}
      # Server GC's per-heap reservations dominate the NST's ~263 GB VmSize, so
      # this pair is the lever on how much memory the process actually commits
      # — and therefore on how big a CRIU checkpoint is, which is what a
      # snapshot restore's duration tracks. DOTNET_GCHeapCount=2 halves the
      # checkpoint (3.0G -> 1.5G) and halves criu with it (26s -> 12s).
      #
      # Both stay UNSET by default. Server GC is the default because it speeds
      # up the parallel Roslyn compile during startup and extension publish, and
      # the cost of capping the heaps has been measured on the restore but NOT
      # on test-execution throughput. Adopt only after measuring that.
      DOTNET_gcServer: ${DOTNET_gcServer:-}
      DOTNET_GCHeapCount: ${DOTNET_GCHeapCount:-}
      DOTNET_GCNoAffinitize: ${DOTNET_GCNoAffinitize:-}
    volumes:
      - ${BC_ARTIFACTS_DIR:-bc-artifacts}:/bc/artifacts
      - bc-service:/bc/service
      # Compiled-assembly (R2R) cache. 1.2 GB on BC 28.1 and rebuilt from
      # scratch every boot when it lives in the container filesystem. The
      # entrypoint symlinks BC's per-instance apps/assembly dirs in here and
      # stamps it with the platform + image, so a version change or an image
      # rebuild clears it rather than feeding NST assemblies compiled by a
      # different build.
      - bc-assembly-cache:/bc/assembly-cache
      # Optional bind mount for an ISV/developer license. Set BC_LICENSE_HOST_PATH
      # to the absolute path of a .bclicense file on the host; the entrypoint will
      # import it (when BC_LICENSE_FILE=/bc/custom-license.bclicense is also set)
      # before NST starts. Defaults to /dev/null when unset, so the file appears as
      # a character device — the entrypoint's `[ -f ]` check fails and the default
      # Cronus license is used. No effect when unset.
      - ${BC_LICENSE_HOST_PATH:-/dev/null}:/bc/custom-license.bclicense:ro
    healthcheck:
      test: test -f /tmp/bc-ready && curl -sf -o /dev/null -u '${BC_SERVER_USERNAME:-BCRUNNER}:${BC_SERVER_PASSWORD:-Admin123!}' http://localhost:7048/BC/ODataV4/Company || exit 1
      # 2s interval (was 15s, then 5s) so the healthy transition is seen within
      # ~2s of the entrypoint touching /tmp/bc-ready. With cold boots down to
      # ~30-80s (R2R Merkle seeding + fast downloads), a 5s interval was
      # 7-15% of the whole wait. The OData /Company probe is cheap.
      interval: 2s
      retries: 900            # 2s × 900 = 30 min after start_period
      start_period: 60s
      timeout: 5s             # was 10s; the probe is cheap, fail fast

volumes:
  bc-artifacts:
  bc-service:
  bc-assembly-cache:
